name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          A="https://site.api.espn.com/apis/site/v2/sports/football/nfl"
          get(){ curl -s -m 40 -A "Mozilla/5.0" "$2" -o "$1.json"; echo "$1 $(wc -c < $1.json)"; }
          get depth2 "$A/teams/9/depthcharts"
          get lead_a "$A/teams/9/leaders"
          get lead_b "$A/teams/gb/leaders"
          get stats_a "$A/teams/9/statistics"
          get stats_b "$A/teams/gb/statistics"
          get lead_c "https://site.api.espn.com/apis/site/v3/sports/football/nfl/teams/9/leaders"
          get lead_d "$A/leaders?team=9"
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
