name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          curl -s -m 30 "$S/api/ask" -o ask_get.json
          curl -s -m 60 -X POST "$S/api/ask" -H "content-type: application/json" -d '{"q":"When is the next Vikings game and who leads them in receiving?","context":"Team: Minnesota Vikings. Record 6-0. Schedule: Wk8 at DET Sun Nov 1 12:00 PM CT FOX. Players: Justin Jefferson (WR): 40 rec 600 yds 5 TD; Jordan Addison (WR): 25 rec 300 yds 2 TD."}' -o ask_post.json
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
