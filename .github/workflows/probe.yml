name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          sleep 90
          U="https://www.vikings.com/video/kyler-murray-colts-run-game-week-7-2026"
          curl -s -m 30 -A "Mozilla/5.0 (compatible; NorthHuddleBot/1.0; link preview)" "$U" -o v.html -w "runner %{http_code} %{size_download}\n" > stat.txt
          grep -o '<meta[^>]*og:image[^>]*>' v.html | head -3 >> stat.txt
          E=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$U")
          curl -s -m 40 -o /dev/null -w "cf-thumb %{http_code} %{redirect_url}\n" "$S/api/thumb?u=$E" >> stat.txt
          curl -s -m 30 -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" "$U" -o v2.html -w "runner-browserUA %{http_code} %{size_download}\n" >> stat.txt
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
