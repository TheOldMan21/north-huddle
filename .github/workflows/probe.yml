name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          sleep 90
          sleep 150
          curl -s -m 60 "$S/g/401873014" -A "facebookexternalhit/1.1" -o g.html
          curl -s -m 60 "$S/api/og?event=401873014" -o og.png -w "og %{http_code} %{content_type} %{size_download}\n" > stat.txt
          curl -s -m 30 "$S/terms.html" -o /dev/null -w "terms %{http_code}\n" >> stat.txt
          curl -s -m 30 "$S/some-bad-page" -o nf.html -w "404 %{http_code}\n" >> stat.txt
          curl -s -m 30 "$S/" -H "accept-encoding: br" -o /dev/null -w "home %{http_code} %{size_download} bytes br\n" >> stat.txt
          curl -s -m 30 -I "$S/js/supabase.js" | grep -i cache-control >> stat.txt
          curl -s -m 30 "$S/" | grep -c "nh-mark" >> stat.txt
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
