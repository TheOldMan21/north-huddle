name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          sleep 90
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" -o sb.json
          E=$(python3 -c "import json;print(json.load(open('sb.json'))['events'][0]['id'])")
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=$E" -o sum.json
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=7&dates=2026" -o sb7.json
          python3 - <<'PY' > stat.txt
          import json
          sb=json.load(open("sb.json")); e=sb["events"][0]; h=e["competitions"][0].get("headlines",[])
          print("event", e["id"], e["name"])
          for x in h: v=x.get("video") or []; print("headline video", type(v).__name__, json.dumps(v)[:900])
          s=json.load(open("sum.json")); v=s.get("videos",[])
          print("summary videos", len(v))
          for x in v[:6]: print(json.dumps({k:x.get(k) for k in ["id","headline","duration","thumbnail","originalPublishDate"]})[:400], "| web:", (x.get("links") or {}).get("web",{}).get("href"), "| src keys:", list(((x.get("links") or {}).get("source") or {}).keys())[:6])
          s7=json.load(open("sb7.json")); 
          for e in s7.get("events",[])[:3]:
              h=e["competitions"][0].get("headlines",[]); print("wk7", e["id"], [len(x.get("video") or []) for x in h])
          PY
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
