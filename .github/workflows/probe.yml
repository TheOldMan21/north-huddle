name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          sleep 90
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401873014" -o sum.json
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=50" -o news.json
          curl -s -m 30 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard" -o sb.json
          python3 - <<'PY' > stat.txt
          import json
          s=json.load(open("sum.json")); v=s.get("videos",[])
          print("summary videos", len(v))
          for x in v[:4]: print(json.dumps({k:x.get(k) for k in ["id","headline","description","duration","thumbnail","originalPublishDate"]}), "| links:", list((x.get("links") or {}).keys()), (x.get("links") or {}).get("web",{}).get("href"), "| src:", list(((x.get("links") or {}).get("source") or {}).keys()))
          n=json.load(open("news.json")); m=[a for a in n.get("articles",[]) if a.get("type")=="Media"]
          print("news media", len(m), "of", len(n.get("articles",[])))
          for a in m[:5]: print(a.get("headline"), "|", a.get("published"), "|", (a.get("images") or [{}])[0].get("url"), "|", (a.get("links") or {}).get("web",{}).get("href"), "| cats:", [c.get("description") for c in a.get("categories",[])][:4], "| dur", a.get("duration"))
          sb=json.load(open("sb.json")); 
          for e in sb.get("events",[])[:2]:
              c=e["competitions"][0]; print("sb headlines keys", [ (h.get("type"), h.get("shortLinkText"), list(h.keys())) for h in c.get("headlines",[])][:2])
          PY
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
