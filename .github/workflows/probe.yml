name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          sleep 120
          curl -s -m 90 "$S/api/recap?event=401873014" -o recap.json
          curl -s -m 30 "$S/api/scores?week=6" -o week6.json
          curl -s -m 30 "$S/" | grep -c "round 3" > build.txt || true
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
