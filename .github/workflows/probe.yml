name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          sleep 100
          curl -s -m 60 "$S/api/team?abbr=MIN" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps([(n['source'],n.get('image','')[:90]) for n in d.get('news',[])[:5]],indent=0))" > team_news.txt
          for u in "https://www.vikings.com/news/" "https://www.cbssports.com/nfl/teams/MIN/minnesota-vikings/" "https://www.espn.com/nfl/team/_/name/min/minnesota-vikings"; do echo "$u" >> thumbs.txt; curl -s -m 30 -o /dev/null -w "%{http_code} %{redirect_url}\n" "$S/api/thumb?u=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$u")" >> thumbs.txt; done
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
