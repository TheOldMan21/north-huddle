name: probe-site
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live site endpoints
        run: |
          mkdir -p out && cd out
          S="https://north-huddle.pages.dev"
          S="https://north-huddle.pages.dev"
          sleep 90
          curl -s -m 60 "$S/api/scores?event=401873014&team=MIN&v=2" -o ev.json
          curl -s -m 60 "$S/api/scores?team=MIN" -o cur.json
          curl -s -m 60 "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401873014" -o sum.json
          python3 - <<'PY' > box.txt
          import json
          for f in ["ev.json","cur.json"]:
              d=json.load(open(f)); fo=d.get("focus") or {}
              print(f, "week",d.get("week"),"focus id",fo.get("id"),"box teams",[ (b["team"],{k:len(v["rows"]) for k,v in b["cats"].items()}) for b in fo.get("box",[])])
          s=json.load(open("sum.json"))
          for t in s.get("boxscore",{}).get("players",[]):
              print(t["team"].get("abbreviation"), [(st.get("name"), st.get("labels"), len(st.get("athletes",[]))) for st in t.get("statistics",[])][:4])
          print("teams stats keys", [ [x.get("name") for x in t.get("statistics",[])][:5] for t in s.get("boxscore",{}).get("teams",[])])
          PY
          ls -la
      - name: Commit
        run: |
          cd out
          git init -q && git checkout -q -b probe-out
          git config user.name probe && git config user.email probe@example.com
          git add -A && git commit -qm samples
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-out
