async function submitClaim(v){
  const L=LG.doc, bid=Math.max(0,Math.min(budget(L,ACC.id),Math.floor(Number(v.bid)||0)));
  await lgRef(L.id).update({claims:{[rid()]:{uid:ACC.id, add:v.add, drop:v.drop||"", bid, t:nowIso(), key:waiverKey(), status:"pending"}}});
  closeSheet(); toast("Claim placed. Results Wednesday morning.");
}
function processClaims(D){
  const pend=Object.entries(D.claims||{}).filter(([,c])=>c.status==="pending" && claimDue(c.key));
  if(!pend.length) return null;
  const rosters=JSON.parse(JSON.stringify(D.rosters||{})), faab={...(D.faab||{})}, out={}, tx=[];
  const order=standings(D).map(r=>r.uid).reverse(); // worst first
  let left=pend.map(([id,c])=>({id,...c}));
  const owned=()=>{ const s=new Set(); Object.values(rosters).forEach(a=>a.forEach(x=>s.add(x))); return s; };
  while(left.length){
    left.sort((a,b)=>b.bid-a.bid || order.indexOf(a.uid)-order.indexOf(b.uid) || a.t.localeCompare(b.t));
    const c=left.shift(), ros=rosters[c.uid]||[], own=owned(), bud=Number(faab[c.uid]??100);
    const ok=!own.has(c.add) && (!c.drop||ros.includes(c.drop)) && bud>=c.bid && (ros.length-(c.drop?1:0)+1)<=ROSTER_MAX;
    if(!ok){ out[c.id]={status: own.has(c.add)?"lost":"failed"}; continue; }
    rosters[c.uid]=ros.filter(x=>x!==c.drop).concat(c.add); faab[c.uid]=bud-c.bid; out[c.id]={status:"won"};
    tx.push({t:nowIso(),uid:c.uid,add:c.add,drop:c.drop||"",bid:c.bid});
    left.filter(x=>x.add===c.add).forEach(x=>out[x.id]={status:"lost"}); left=left.filter(x=>x.add!==c.add);
  }
  return {rosters, faab, claims:out, txns:[...tx,...(D.txns||[])].slice(0,40)};
}

/* ---------- trades ---------- */
const TR={to:"", give:new Set(), get:new Set()};
function tradesOf(L){ return Object.entries(L.trades||{}).map(([id,t])=>({id,...t})).sort((a,b)=>b.t.localeCompare(a.t)); }
function pendingTradesFor(L){ return tradesOf(L).filter(t=>t.status==="pending" && t.to===ACC.id); }
function tradeLine(L,t){ return `${esc(teamName(L,t.from))} gives ${t.give.map(id=>esc(P(id).name)).join(", ")||"nothing"} · ${esc(teamName(L,t.to))} gives ${t.get.map(id=>esc(P(id).name)).join(", ")||"nothing"}`; }
function renderTrades(L){
  const others=(L.members||[]).filter(u=>u!==ACC.id), all=tradesOf(L), isC=L.commish===ACC.id;
  const inc=all.filter(t=>t.status==="pending"&&t.to===ACC.id), out=all.filter(t=>t.status==="pending"&&t.from===ACC.id), rev=all.filter(t=>t.status==="review");
  const hist=all.filter(t=>!["pending","review"].includes(t.status)).slice(0,8);
  const card=(t,btns)=>`<div class="card lg-trade"><div class="t2">${esc(ago(t.t))}</div><div>${tradeLine(L,t)}</div>${t.note?`<div class="t2">${esc(t.note)}</div>`:""}<div class="lg-btns">${btns}</div></div>`;

  if(inc.length) h+=`<h2>Offers to you</h2>`+inc.map(t=>card(t,`<button class="tbtn" data-tacc="${t.id}">Accept</button><button class="tbtn" data-trej="${t.id}">Reject</button>`)).join("");
  if(rev.length) h+=`<h2>Under review</h2>`+rev.map(t=>card(t,`<span class="t2">Goes through ${esc(fmtDate(t.processAt,{weekday:"short",hour:"numeric",minute:"2-digit"}))} CT</span>${isC?`<button class="tbtn" data-tveto="${t.id}">Veto</button>`:""}`)).join("");
  if(out.length) h+=`<h2>Your offers</h2>`+out.map(t=>card(t,`<button class="tbtn" data-tcan="${t.id}">Cancel</button>`)).join("");
  const sel=`<label>Trade with<select data-trto>${["",...others].map(u=>`<option value="${u}"${u===TR.to?" selected":""}>${u?esc(teamName(L,u)):"Choose a team"}</option>`).join("")}</select></label>`;
  let comp=`<div class="card lg-form"><div class="lg-ft">Propose a trade</div><div class="lg-grid">${sel}</div>`;
  if(TR.to){
    const col=(uid,set,key,title)=>`<div class="tr-col"><div class="label">${title}</div>${(L.rosters?.[uid]||[]).map(id=>`<button class="tr-p${set.has(id)?" on":""}" data-${key}="${esc(id)}"><span class="chip pos">${esc(P(id).pos)}</span> ${esc(P(id).name)}</button>`).join("")}</div>`;
    comp+=`<div class="tr-cols">${col(ACC.id,TR.give,"tgive","You give")}${col(TR.to,TR.get,"tget","You get")}</div>
      <button class="btn-gold" data-tsend="1"${TR.give.size||TR.get.size?"":" disabled"}>Send offer</button>`;
  }
  comp+=`<div class="foot">Accepted trades wait 24 hours so the commissioner can veto, then go through automatically.</div></div>`;
  h+=comp;
  if(hist.length) h+=`<h2>Recent</h2><div class="list">${hist.map(t=>`<div class="row"><div class="grow"><div class="t2">${tradeLine(L,t)}</div></div><span class="chip ${t.status==="done"?"w":"l"}">${esc({done:"DONE",rejected:"REJECTED",vetoed:"VETOED",canceled:"CANCELED",failed:"FAILED"}[t.status]||t.status)}</span></div>`).join("")}</div>`;
  return h;
}
async function sendTrade(){
  const L=LG.doc; if(!TR.to) return;
  await lgRef(L.id).update({trades:{[rid()]:{from:ACC.id,to:TR.to,give:[...TR.give],get:[...TR.get],status:"pending",t:nowIso()}}});
  TR.give.clear(); TR.get.clear(); toast("Trade offer sent."); renderFantasy();
}
async function setTrade(id,patch){ await lgRef(LG.doc.id).update({trades:{[id]:patch}}); }
async function acceptTrade(id){
  const L=LG.doc, n=(L.members||[]).length;
  await setTrade(id, n>=3?{status:"review",processAt:new Date(Date.now()+864e5).toISOString(),acceptedAt:nowIso()}:{status:"review",processAt:nowIso(),acceptedAt:nowIso()});
  toast(n>=3?"Accepted. It goes through in 24 hours unless vetoed.":"Accepted."); processPending();
}
function processTrades(D){
  const due=Object.entries(D.trades||{}).filter(([,t])=>t.status==="review" && Date.parse(t.processAt)<=Date.now());
  if(!due.length) return null;
  const rosters=JSON.parse(JSON.stringify(D.rosters||{})), out={}, tx=[]; const w=Math.max(curWeek(),D.startWeek||1);
  due.forEach(([id,t])=>{
    const A=rosters[t.from]||[], B=rosters[t.to]||[];
    if(!t.give.every(x=>A.includes(x)) || !t.get.every(x=>B.includes(x))){ out[id]={status:"failed",note:"A player in this deal is no longer on the roster."}; return; }
    if([...t.give,...t.get].some(x=>locked(x,w))) return; // wait until players unlock
    const nA=A.filter(x=>!t.give.includes(x)).concat(t.get), nB=B.filter(x=>!t.get.includes(x)).concat(t.give);
    if(nA.length>ROSTER_MAX||nB.length>ROSTER_MAX){ out[id]={status:"failed",note:"A roster would be over the limit. Drop a player and try again."}; return; }
    rosters[t.from]=nA; rosters[t.to]=nB; out[id]={status:"done",doneAt:nowIso()};
    tx.push({t:nowIso(),uid:t.from,trade:tradeLine(D,t).replace(/&amp;/g,"&")});
  });
  if(!Object.keys(out).length) return null;
  return {rosters, trades:out, txns:[...tx,...(D.txns||[])].slice(0,40)};
}
let procBusy=false, procLast=0;
async function processPending(){
  const L=LG.doc; if(!L||L.status!=="season"||procBusy||Date.now()-procLast<20000) return;
  const needT=Object.values(L.trades||{}).some(t=>t.status==="review"&&Date.parse(t.processAt)<=Date.now());
  const needW=Object.values(L.claims||{}).some(c=>c.status==="pending"&&claimDue(c.key));
  if(!needT&&!needW) return;
  procBusy=true; procLast=Date.now();
  try{ await withLease(L.id, D=>{
    if(!D||D.status!=="season") return null;
    let patch=processTrades(D);
    if(patch){ D={...D, rosters:patch.rosters, txns:patch.txns}; }
    const w=processClaims(D);
    if(w) patch={...(patch||{}), ...w, trades:patch?.trades};
    if(patch && !patch.trades) delete patch.trades;
    return patch;
  }); }catch(e){ console.warn("process",e); }
  procBusy=false;
}

/* ---------- weekly picks (pick'em) ---------- */
LG.pw=null;
const gk=g=>g.away+"@"+g.home;
function gameWinner(g){ if(!g.final||g.hs==null||g.as==null) return null; return g.hs>g.as?g.home:g.as>g.hs?g.away:"TIE"; }
function pickemBoard(L){

}

    const others=lk?(L.members||[]).filter(u=>u!==ACC.id).map(u=>{const p=L.picks?.[wk]?.[u]?.[k]; return p?`${esc(teamName(L,u))}: ${esc(p)}`:null;}).filter(Boolean).join(" · "):"";

function lastFinalWeek(L){ let lw=0; for(let w=L.startWeek||1; w<=lastWeek(L); w++) if(LG.fstats[wKey(w)]?.final) lw=w; return lw; }
function recapCard(L){
  if(!L||L.status!=="season") return "";
  const w=lastFinalWeek(L); if(!w) return "";
  const ms=matchupsFor(L,w).filter(m=>m[0]&&m[1]); if(!ms.length) return "";
  const sc=u=>teamScore(L,u,w);
  const teams=[...new Set(ms.flat())];
  const top=teams.reduce((a,u)=>sc(u)>sc(a)?u:a);
  const blow=ms.map(([a,b])=>({a,b,m:Math.abs(sc(a)-sc(b))})).sort((x,y)=>y.m-x.m)[0];
  const winner=blow?(sc(blow.a)>=sc(blow.b)?blow.a:blow.b):null, loser=blow?(winner===blow.a?blow.b:blow.a):null;
  let bench={u:null,p:0}, star={id:null,u:null,p:-1};
  teams.forEach(u=>{ const lu=lineupFor(L,u,w), st=new Set(starters(lu)); const bp=(L.rosters?.[u]||[]).filter(id=>!st.has(id)).reduce((a,id)=>a+ptsFor(id,w,L),0); if(bp>bench.p) bench={u,p:bp};
    st.forEach(id=>{ const p=ptsFor(id,w,L); if(p>star.p) star={id,u,p}; }); });
  const lines=[`${ico("trophy")} <b>Top score:</b> ${esc(teamName(L,top))} with ${fmtPts(sc(top))}`];
  if(blow&&blow.m>0) lines.push(`${ico("zap")} <b>Biggest win:</b> ${esc(teamName(L,winner))} over ${esc(teamName(L,loser))} by ${fmtPts(blow.m)}`);
  if(star.id) lines.push(`${ico("star")} <b>Player of the week:</b> ${esc(P(star.id).name)}, ${star.p.toFixed(1)} pts for ${esc(teamName(L,star.u))}`);
  if(bench.u&&bench.p>0) lines.push(`${ico("bench")} <b>Bench blunder:</b> ${esc(teamName(L,bench.u))} left ${bench.p.toFixed(1)} pts on the bench`);
  return `<div class="card recap"><div class="label">Week ${w} recap</div>${lines.map(l=>`<div class="recap-l">${l}</div>`).join("")}</div>`;
}

/* ---------- smart alerts ---------- */
const OUT_ST=new Set(["RES","RSR","RSN","NON","PUP","SUS","EXE"]);
function lineupIssues(L){
  if(!L||L.status!=="season"||!ACC.id) return [];
  const w=actWeek(L), lu=lineupFor(L,ACC.id,w), out=[];
  const inj=fdoc("injuries")?.items||[];
  const idx={}; NFLIDX.forEach(p=>idx[p.id]=p);
  SLOTS.forEach(([s,c])=>{ for(let i=0;i<c;i++){ const id=lu[s]?.[i];
    if(!id){ out.push(`Your ${s} spot is empty.`); continue; }
    if(locked(id,w)) continue;
    const p=P(id), d=idx[id];
    if(LG.fweeks[wKey(w)] && !gameOf(p.abbr,w)) out.push(`${p.name} is on bye this week.`);
    else if(d && OUT_ST.has(d.st)) out.push(`${p.name} is ${STLABEL[d.st]||"inactive"}.`);
    else { const j=inj.find(x=>norm2(x.name)===p.key && /^(out|doubtful|ir|injured)/i.test(x.status||"")); if(j) out.push(`${p.name}: ${j.status}.`); }
  }});

}

    <label>Your pick<select name="slot"><option value="r">Random</option>${Array.from({length:12},(_,i)=>`<option value="${i}">${i+1}</option>`).join("")}</select></label></div>
    <button class="btn-gold" type="submit">Start practice draft</button></form></div>`;
}
function startMock(v){
  const n=Number(v.n)||10; let slot=v.slot==="r"?Math.floor(Math.random()*n):Math.min(n-1,Number(v.slot)||0);
  MOCK={n, me:"m"+slot, order:Array.from({length:n},(_,i)=>"m"+i), picks:[], rounds:ROSTER_MAX};
  LG.q=""; LG.pos="ALL"; renderFantasy(); mockStep();
}
function mockL(){ return {status:"drafting", draft:{order:MOCK.order, picks:MOCK.picks, rounds:MOCK.rounds}, queues:LG.doc?.queues?{[MOCK.me]:LG.doc.queues[ACC.id]||[]}:{}}; }
function mockStep(){
  if(!MOCK) return; const L=mockL(), n=MOCK.picks.length;
  if(n>=MOCK.rounds*MOCK.n){ renderFantasy(); return; }
  const who=onClockUid(L,n); if(who===MOCK.me){ renderFantasy(); return; }
  setTimeout(()=>{ if(!MOCK||MOCK.picks.length!==n) return;
    let id=autoChoice(L,who);
    if(Math.random()<0.35){ const L2={...L, draft:{...L.draft, picks:[...MOCK.picks,{uid:"x",pid:id}]}}; const alt=autoChoice(L2,who); if(alt) id=alt; }
    MOCK.picks.push({uid:who,pid:id}); if(MOCK.picks.length%MOCK.n===0||onClockUid(mockL(),MOCK.picks.length)===MOCK.me) renderFantasy(); mockStep(); },120);
}
function renderMock(){
  const L=mockL(), n=MOCK.picks.length, total=MOCK.rounds*MOCK.n, done=n>=total, mine=!done&&onClockUid(L,n)===MOCK.me;
  const myP=MOCK.picks.filter(p=>p.uid===MOCK.me).map(p=>P(p.pid));
  let h=`<div class="lg-clock${mine?" mine":""}"><div><div class="label">Practice · ${done?"Complete":`Round ${Math.floor(n/MOCK.n)+1} · Pick ${n+1} of ${total}`}</div><div class="lg-otc">${done?"Draft complete":mine?"Your pick":"Computer teams picking…"}</div></div><button class="tbtn" data-mexit="1">Exit</button></div>`;
  if(!done){
    const taken=new Set(MOCK.picks.map(p=>p.pid)), q=norm2(LG.q);
    const list=pool().list.filter(p=>!taken.has(p.id)&&(LG.pos==="ALL"||p.pos===LG.pos)&&(!q||p.key.includes(q))).slice(0,50);
    h+=`<input type="search" id="lgSearch" placeholder="Search players" value="${esc(LG.q)}" aria-label="Search players">${posFilter()}
      <div class="list lg-avail" id="lgList">${list.map(p=>playerRow(p,`<button class="tbtn" data-mpick="${esc(p.id)}"${mine?"":" disabled"}>Pick</button>`)).join("")}</div>`;
  }
  const cnt={}; myP.forEach(p=>cnt[p.pos]=(cnt[p.pos]||0)+1);
  h+=`<h2>Your team (${myP.length}/${MOCK.rounds})</h2><div class="t2">${Object.entries(cnt).map(([k,v])=>`${k} ${v}`).join(" · ")||"No picks yet"}</div><div class="list">${myP.map(p=>playerRow(p)).join("")||`<div class="empty">No picks yet.</div>`}</div>`;
  if(done){ const avg=myP.filter(p=>p.rank<9999).reduce((a,p)=>a+p.rank,0)/Math.max(1,myP.filter(p=>p.rank<9999).length); h+=`<div class="card">Average rank of your ranked players: <b>${avg.toFixed(0)}</b>. Lower is better. Try a different pick slot or strategy and run it again.</div><button class="btn-gold" data-mexit="1">Done</button>`; }
  return h;
}
function mockPick(id){ if(!MOCK) return; const L=mockL(); if(onClockUid(L,MOCK.picks.length)!==MOCK.me) return; if(MOCK.picks.some(p=>p.pid===id)) return; MOCK.picks.push({uid:MOCK.me,pid:id}); renderFantasy(); mockStep(); }

/* ---------- trophies + next season ---------- */
function champion(L){
  const lw=lastWeek(L); if(!LG.fstats[wKey(lw)]?.final) return null;
  const m=matchupsFor(L,lw)[0]; if(!m||!m[0]||!m[1]) return null;
  const a=teamScore(L,m[0],lw), b=teamScore(L,m[1],lw); return {champ:a>=b?m[0]:m[1], runner:a>=b?m[1]:m[0], score:`${fmtPts(Math.max(a,b))}–${fmtPts(Math.min(a,b))}`};
}
function records(L){
  let hi={v:-1}, blow={v:-1}, star={v:-1};
  for(let w=L.startWeek||1; w<=lastWeek(L); w++){
    if(!LG.fstats[wKey(w)]?.final) continue;
    matchupsFor(L,w).forEach(([a,b])=>{ [a,b].filter(Boolean).forEach(u=>{ const s=teamScore(L,u,w); if(s>hi.v) hi={v:s,u,w};
        starters(lineupFor(L,u,w)).forEach(id=>{ const p=ptsFor(id,w,L); if(p>star.v) star={v:p,u,w,id}; }); });
      if(a&&b){ const d=Math.abs(teamScore(L,a,w)-teamScore(L,b,w)); if(d>blow.v) blow={v:d,w,win:teamScore(L,a,w)>=teamScore(L,b,w)?a:b,lose:teamScore(L,a,w)>=teamScore(L,b,w)?b:a}; } });
  }
  return {hi,blow,star};
}
function renderTrophies(L,isC){
  const ch=champion(L), r=records(L), st=standings(L);
  let h=ch?`<div class="trophy"><div class="trophy-cup">${ico("trophy","big")}</div><div><div class="label">${L.season||2026} champion</div><div class="lg-name">${esc(teamName(L,ch.champ))}</div><div class="t2">Beat ${esc(teamName(L,ch.runner))} ${ch.score} in the final</div></div></div>`
    :`<div class="card"><div class="lg-ft">${L.season||2026} season</div><p style="margin:4px 0 0">The champion is crowned after the final playoff week.</p></div>`;
  const rec=[];
  if(r.hi.v>=0) rec.push(["Highest score",`${fmtPts(r.hi.v)}`,`${teamName(L,r.hi.u)} · Week ${r.hi.w}`]);
  if(r.blow.v>0) rec.push(["Biggest blowout",`${fmtPts(r.blow.v)}`,`${teamName(L,r.blow.win)} over ${teamName(L,r.blow.lose)} · Week ${r.blow.w}`]);
  if(r.star.v>=0&&r.star.id) rec.push(["Best player game",`${r.star.v.toFixed(1)}`,`${P(r.star.id).name} for ${teamName(L,r.star.u)} · Week ${r.star.w}`]);
  if(st.length&&st[0].pf>0){ const pf=[...st].sort((a,b)=>b.pf-a.pf)[0]; rec.push(["Most points (season)",fmtPts(pf.pf),teamName(L,pf.uid)]); }
  h+=`<h2>League records</h2>`+(rec.length?`<div class="list">${rec.map(([a,b,c])=>`<div class="row"><div class="grow"><div class="t1">${esc(a)}</div><div class="t2">${esc(c)}</div></div><b class="num lg-rec">${esc(b)}</b></div>`).join("")}</div>`:`<div class="card empty">Records fill in as weeks become final.</div>`);
  const hist=L.history||[];
  if(hist.length) h+=`<h2>Hall of champions</h2><div class="list">${hist.slice().reverse().map(x=>`<div class="row"><span class="rk">${ico("trophy")}</span><div class="grow"><div class="t1">${esc(x.season)} · ${esc(x.champName)}</div><div class="t2">${esc(x.note||"")}</div></div></div>`).join("")}</div>`;
  if(isC&&ch) h+=`<button class="btn-gold" data-lnext="1">Start next season</button><div class="foot">Keeps the same teams, saves this season to the Hall of champions, and resets rosters for a new draft.</div>`;
  return h;
}
async function startNextSeason(){
  const L=LG.doc, ch=champion(L); if(!ch) return;
  const r=records(L);
  await withLease(L.id, D=>{
    if(D.status!=="season") return null;
    const note=`Beat ${teamName(D,ch.runner)} ${ch.score}`+(r.hi.v>=0?` · High score ${fmtPts(r.hi.v)} (${teamName(D,r.hi.u)})`:"");
    const hist=[...(D.history||[]),{season:D.season||2026, champ:ch.champ, champName:teamName(D,ch.champ), note, at:nowIso()}];
    return {__set:{name:D.name, code:D.code, commish:D.commish, size:D.size, scoring:D.scoring, clock:D.clock, status:"setup", createdAt:D.createdAt, season:(D.season||2026)+1,
      members:D.members, teams:D.teams, history:hist, draft:{startAt:"",order:[],picks:[],pickStart:""}, rosters:{}, lineups:{}, matchups:{}, txns:[], trades:{}, claims:{}, picks:{}, faab:{}, queues:{}}};
  });
  toast("New season ready. Set a draft time!");
}

  const dn=t.closest("[data-qdn]"); if(dn){ moveQueue(dn.dataset.qdn,1); return; }
  const wc=t.closest("[data-wcancel]"); if(wc){ await lgRef(LG.doc.id).update({claims:{[wc.dataset.wcancel]:{status:"canceled"}}}); return; }
  const tg=t.closest("[data-tgive]"); if(tg){ const id=tg.dataset.tgive; TR.give.has(id)?TR.give.delete(id):TR.give.add(id); renderFantasy(); return; }
  const tt=t.closest("[data-tget]"); if(tt){ const id=tt.dataset.tget; TR.get.has(id)?TR.get.delete(id):TR.get.add(id); renderFantasy(); return; }
  if(t.closest("[data-tsend]")){ sendTrade(); return; }
  const ta=t.closest("[data-tacc]"); if(ta){ acceptTrade(ta.dataset.tacc); return; }
  const tr=t.closest("[data-trej]"); if(tr){ setTrade(tr.dataset.trej,{status:"rejected"}); return; }
  const tc=t.closest("[data-tcan]"); if(tc){ setTrade(tc.dataset.tcan,{status:"canceled"}); return; }
  const tv=t.closest("[data-tveto]"); if(tv){ setTrade(tv.dataset.tveto,{status:"vetoed"}); return; }

document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-lform]"); if(!f) return;
  const kind=f.dataset.lform; if(!["claim","chat","mock"].includes(kind)) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const v=Object.fromEntries(new FormData(f).entries());
  try{
    if(kind==="claim") await submitClaim(v);
    else if(kind==="chat"){ f.reset(); await sendChat(v.text); }
    else if(kind==="mock") startMock(v);
  }catch(err){ console.warn(err); toast("Something went wrong. Try again."); }
},true);

function barPath(x,y,w,h){ const r=Math.min(4,w/2,h); if(h<=0) return ""; return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function trendsHtml(){
  const g=S.games.filter(x=>x.status==="final"&&x.us!=null).sort((a,b)=>a.week-b.week); if(g.length<2) return "";
  const W=340,H=170,pl=26,pb=22,pt=8, max=Math.max(10,...g.flatMap(x=>[x.us,x.them])), top=Math.ceil(max/10)*10;
  const cw=(W-pl)/g.length, bw=Math.min(16,(cw-8)/2), y=v=>pt+(H-pt-pb)*(1-v/top);
  let grid=""; for(let v=0; v<=top; v+=10){ grid+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${pl-5}" y="${y(v)+3}" class="ch-ax" text-anchor="end">${v}</text>`; }
  const bars=g.map((x,i)=>{ const cx=pl+cw*i+cw/2, h1=y(0)-y(x.us), h2=y(0)-y(x.them);
    return `<g class="ch-g" data-tip="Week ${x.week} ${x.home?"vs":"@"} ${esc(x.oppAbbr)}: ${esc(NICK())} ${x.us}, ${esc(x.oppAbbr)} ${x.them} (${esc(x.result||"")})"><rect x="${cx-cw/2}" y="${pt}" width="${cw}" height="${H-pt}" class="ch-hit"/>
      <path d="${barPath(cx-bw-1,y(x.us),bw,h1)}" class="ch-s1"/><path d="${barPath(cx+1,y(x.them),bw,h2)}" class="ch-s2"/>
      <text x="${cx}" y="${H-6}" class="ch-ax" text-anchor="middle">${esc(x.oppAbbr)}</text></g>`; }).join("");
  const pf=g.reduce((a,x)=>a+x.us,0)/g.length, pa=g.reduce((a,x)=>a+x.them,0)/g.length;
  return `<h2>Season trends</h2><div class="card chart"><div class="ch-head"><div class="ch-legend"><span><i class="sw s1"></i>${esc(NICK())}</span><span><i class="sw s2"></i>Opponents</span></div>
    <div class="ch-tiles"><span><b class="num">${pf.toFixed(1)}</b> avg scored</span><span><b class="num">${pa.toFixed(1)}</b> avg allowed</span></div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Points scored and allowed by game">${grid}<line x1="${pl}" x2="${W}" y1="${y(0)}" y2="${y(0)}" class="ch-base"/>${bars}</svg>
    <div class="ch-tip" id="chTip">Tap a game to see the score.</div></div>`;
}

/* compare */
const CMP={a:"",b:""};
const CMP_STATS=[["Pass yds",p=>p.stats?.pass?.yds],["Pass TD",p=>p.stats?.pass?.td],["INT thrown",p=>p.stats?.pass?.int],["Rush yds",p=>p.stats?.rush?.yds],["Rush TD",p=>p.stats?.rush?.td],["Receptions",p=>p.stats?.rec?.rec],["Targets",p=>p.stats?.rec?.tgt],["Rec yds",p=>p.stats?.rec?.yds],["Rec TD",p=>p.stats?.rec?.td],["Tackles",p=>p.stats?.def?.tkl],["Sacks",p=>p.stats?.def?.sacks],["Interceptions",p=>p.stats?.def?.int],["Forced fumbles",p=>p.stats?.def?.ff]];
function renderCompare(){
  const el=$("pCompare"); if(!el) return;
  const ps=[...S.players].sort((a,b)=>(b.rank||0)-(a.rank||0));
  if(!ps.length){ el.innerHTML=`<div class="card empty">Player stats appear here once data loads.</div>`; return; }
  if(!ps.find(p=>p.id===CMP.a)) CMP.a=ps[0].id; if(!ps.find(p=>p.id===CMP.b)) CMP.b=(ps.find(p=>p.id!==CMP.a&&p.pos===ps[0].pos)||ps[1]||ps[0]).id;
  const A=ps.find(p=>p.id===CMP.a), B=ps.find(p=>p.id===CMP.b);
  const opt=cur=>ps.map(p=>`<option value="${esc(p.id)}"${p.id===cur?" selected":""}>${esc(p.name)} (${esc(p.pos||"")})</option>`).join("");
  const rows=CMP_STATS.map(([l,f])=>{ const x=Number(f(A)||0), y=Number(f(B)||0); if(!x&&!y) return ""; const m=Math.max(x,y)||1;
    return `<div class="cmp-row"><div class="cmp-l">${l}</div><div class="cmp-bars"><div class="cmp-b"><i class="s1" style="width:${(x/m*100).toFixed(1)}%"></i><b class="num">${x}</b></div><div class="cmp-b"><i class="s2" style="width:${(y/m*100).toFixed(1)}%"></i><b class="num">${y}</b></div></div></div>`; }).join("");
  el.innerHTML=`<div class="card lg-grid"><div class="lg-row"><label><span><i class="sw s1"></i> Player 1</span><select data-cmp="a">${opt(CMP.a)}</select></label><label><span><i class="sw s2"></i> Player 2</span><select data-cmp="b">${opt(CMP.b)}</select></label></div></div>
    <div class="card chart">${rows||`<div class="empty">No overlapping stats to compare.</div>`}</div>

<script>
/* ===================== Mini game: Field Goal Challenge ===================== */
const FG={on:false, raf:0};
function gameBest(){ return Number(store.get("vh_fgbest")||0); }
function openGame(){
  let ov=$("fgGame");
  if(!ov){
    ov=document.createElement("div"); ov.id="fgGame"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label","Field goal challenge");
    ov.innerHTML=`<div class="fg-top"><div class="fg-stat"><span class="label">Score</span><b id="fgScore" class="num">0</b></div><div class="fg-stat"><span class="label">Kicks left</span><b id="fgLives" class="num"></b></div><div class="fg-stat"><span class="label">Best</span><b id="fgBest" class="num">0</b></div><button class="x" id="fgClose" aria-label="Close game">×</button></div>
      <div class="fg-stage"><canvas id="fgCanvas"></canvas><div class="fg-msg" id="fgMsg"></div></div>
      <div class="fg-help" id="fgHelp">Tap to stop the aim, then tap again to set power.</div>`;
    document.body.appendChild(ov);
    $("fgClose").addEventListener("click",closeGame);
    $("fgCanvas").addEventListener("pointerdown",e=>{ e.preventDefault(); fgTap(); });
    ov.addEventListener("click",e=>{ const b=e.target.closest("[data-fgagain]"); if(b) fgStart(); });
  }
  ov.hidden=false; document.body.style.overflow="hidden"; FG.on=true; fgResize(); fgStart();
  window.addEventListener("resize",fgResize);
}
function closeGame(){ FG.on=false; cancelAnimationFrame(FG.raf); const ov=$("fgGame"); if(ov) ov.hidden=true; document.body.style.overflow=""; window.removeEventListener("resize",fgResize); }
function fgResize(){
  const c=$("fgCanvas"); if(!c) return; const st=c.parentElement.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=st.width*dpr; c.height=st.height*dpr; c.style.width=st.width+"px"; c.style.height=st.height+"px"; FG.w=st.width; FG.h=st.height; FG.dpr=dpr;
}
function fgStart(){
  Object.assign(FG,{score:0, lives:3, dist:20, made:0, phase:"aim", aim:0, aimDir:1, power:0, powDir:1, t:0, ball:null, msg:"", wind:0});
  fgNewKick(); $("fgBest").textContent=gameBest(); fgHud(); $("fgMsg").innerHTML=""; $("fgHelp").textContent="Tap to stop the aim, then tap again to set power.";
  cancelAnimationFrame(FG.raf); FG.last=performance.now(); FG.raf=requestAnimationFrame(fgLoop);
}
function fgNewKick(){
  FG.phase="aim"; FG.aim=-1+Math.random()*2; FG.power=0; FG.powDir=1; FG.ball=null;
  const maxWind=Math.min(15,4+FG.made*1.5); FG.wind=Math.round((Math.random()*2-1)*maxWind);
}
function fgHud(){ $("fgScore").textContent=FG.score; $("fgLives").innerHTML=ico("ball").repeat(FG.lives)||"–"; }
function fgTap(){
  if(FG.phase==="aim"){ FG.phase="power"; FG.power=0; FG.powDir=1; return; }
  if(FG.phase==="power"){ fgKick(); return; }
}
function fgKick(){
  const need=0.22+FG.dist*0.0115;        // power needed to reach the bar
  const drift=FG.aim*0.9 + FG.wind*0.008*FG.dist/20 + (FG.power>1?0:0);
  const over=FG.power>0.96 ? (FG.power-0.96)*6 : 0; // shanking when maxed out
  const finalX=drift + (Math.random()<.5?-1:1)*over*0.4;
  FG.ball={t:0, x:finalX, short:FG.power<need, good:Math.abs(finalX)<0.42 && FG.power>=need};
  FG.phase="flight";
}
function fgResult(){
  const b=FG.ball;
  let text;
  if(b.good){ const pts=FG.dist; FG.score+=pts; FG.made++; text=`<b>IT'S GOOD!</b><span>+${pts} · ${FG.dist} yards</span>`; FG.dist=Math.min(65,FG.dist+5); fgCheer(true); }
  else { FG.lives--; text=`<b class="miss">${b.short?"SHORT!":(b.x<0?"WIDE LEFT!":"WIDE RIGHT!")}</b><span>${FG.dist} yards</span>`; fgCheer(false); }
  fgHud(); $("fgMsg").innerHTML=`<div class="fg-pop">${text}</div>`;
  FG.phase="result";
  setTimeout(()=>{ if(!FG.on) return; $("fgMsg").innerHTML=""; if(FG.lives<=0) fgOver(); else fgNewKick(); },1300);
}
function fgCheer(good){
  if(typeof SOUND!=="undefined"&&!SOUND) return;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const ctx=FG.ctx||(FG.ctx=new AC()); const t=ctx.currentTime;
    const notes=good?[392,523.25,659.25]:[220,174.6]; notes.forEach((f,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t+i*.12); g.gain.exponentialRampToValueAtTime(0.18,t+i*.12+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*.12+.25); o.connect(g); g.connect(ctx.destination); o.start(t+i*.12); o.stop(t+i*.12+.3); });
  }catch(e){}
}
async function fgOver(){
  FG.phase="over";
  const prev=gameBest(), best=Math.max(prev,FG.score); store.set("vh_fgbest",String(best)); $("fgBest").textContent=best;
  let board="";
  if(ACC.db&&ACC.id){
    try{
      const ref=ACC.db.doc("scores/"+ACC.id), cur=await ref.get(), old=cur.exists?Number(cur.data().best||0):0;
      if(FG.score>old) await ref.set({best:FG.score, made:FG.made, t:nowIso()});
      const q=await ACC.db.collection("scores").orderBy("best","desc").limit(10).get();
      board=`<div class="fg-board"><div class="label">Hub leaderboard</div>${q.docs.map((d,i)=>`<div class="fg-row${d.id===ACC.id?" me":""}"><span class="num">${i+1}</span>${av(d.id,"sm")}<span class="fg-nm" data-uname="${esc(d.id)}">${esc(personName(d.id))}</span><b class="num">${esc(d.data().best)}</b></div>`).join("")}</div>`;
    }catch(e){ console.warn("scores",e); }
  } else board=`<div class="fg-note">Sign in to get on the hub leaderboard.</div>`;

function fgLoop(now){
  if(!FG.on) return;
  const dt=Math.min(0.05,(now-FG.last)/1000); FG.last=now;
  const speed=1.1+FG.made*0.12;
  if(FG.phase==="aim"){ FG.aim+=FG.aimDir*dt*speed*1.6; if(FG.aim>1){FG.aim=1;FG.aimDir=-1;} if(FG.aim<-1){FG.aim=-1;FG.aimDir=1;} }

  if(FG.phase==="flight"){ FG.ball.t+=dt/1.1; if(FG.ball.t>=1){ FG.ball.t=1; fgResult(); } }
  fgDraw(); FG.raf=requestAnimationFrame(fgLoop);
}
function fgDraw(){
  const c=$("fgCanvas"), x=c.getContext("2d"), W=FG.w, H=FG.h; x.setTransform(FG.dpr,0,0,FG.dpr,0,0);
  const cs=getComputedStyle(document.documentElement), gold=cs.getPropertyValue("--gold").trim()||"#FFC62F", purple=cs.getPropertyValue("--purple").trim()||"#4F2683";
  // sky + crowd
  const sky=x.createLinearGradient(0,0,0,H*0.35); sky.addColorStop(0,"#0d1b2a"); sky.addColorStop(1,"#23344d"); x.fillStyle=sky; x.fillRect(0,0,W,H*0.35);
  x.fillStyle=purple; x.fillRect(0,H*0.27,W,H*0.08);
  for(let i=0;i<W;i+=7){ x.fillStyle=(i/7)%3?"rgba(255,255,255,.18)":gold; x.globalAlpha=.35; x.fillRect(i,H*0.28+((i*13)%9),3,3); } x.globalAlpha=1;
  // field with perspective
  const hz=H*0.35, gTop=x.createLinearGradient(0,hz,0,H); gTop.addColorStop(0,"#1f5a2c"); gTop.addColorStop(1,"#2f7a3c"); x.fillStyle=gTop; x.fillRect(0,hz,W,H-hz);
  const cx=W/2, vp=(t)=>hz+(H-hz)*Math.pow(t,1.7);
  x.strokeStyle="rgba(255,255,255,.35)"; x.lineWidth=1;
  for(let i=1;i<=8;i++){ const y=vp(i/8); x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke(); }
  x.beginPath(); x.moveTo(cx-W*0.08,hz); x.lineTo(cx-W*0.55,H); x.moveTo(cx+W*0.08,hz); x.lineTo(cx+W*0.55,H); x.stroke();
  // goal posts (far)
  const scale=Math.max(0.55,1.25-FG.dist/60), gw=W*0.26*scale, baseY=hz+6, barY=baseY-H*0.09*scale, upTop=barY-H*0.2*scale;
  x.strokeStyle=gold; x.lineWidth=Math.max(3,5*scale); x.lineCap="round";
  x.beginPath(); x.moveTo(cx,baseY+14); x.lineTo(cx,barY); x.moveTo(cx-gw/2,barY); x.lineTo(cx+gw/2,barY); x.moveTo(cx-gw/2,barY); x.lineTo(cx-gw/2,upTop); x.moveTo(cx+gw/2,barY); x.lineTo(cx+gw/2,upTop); x.stroke();
  // wind flag + text
  x.fillStyle="#fff"; x.font='700 14px "Barlow Condensed",system-ui'; x.textAlign="left";
  const wtxt=FG.wind===0?"No wind":`Wind ${Math.abs(FG.wind)} mph ${FG.wind>0?"→":"←"}`; x.fillText(wtxt,12,22);
  x.textAlign="right"; x.fillText(`${FG.dist}-yard attempt`,W-12,22);
  // aim guide
  const tee={x:cx, y:H-50};
  if(FG.phase==="aim"||FG.phase==="power"){
    const tx=cx+FG.aim*gw*1.1, ty=barY-10;
    x.setLineDash([6,6]); x.strokeStyle="rgba(255,255,255,.8)"; x.lineWidth=2; x.beginPath(); x.moveTo(tee.x,tee.y); x.lineTo(tx,ty); x.stroke(); x.setLineDash([]);
    x.fillStyle=FG.phase==="aim"?gold:"#fff"; x.beginPath(); x.arc(tx,ty,6,0,7); x.fill();
  }
  // power bar
  if(FG.phase==="power"||FG.phase==="aim"){
    const bw=14, bh=H*0.36, bx=W-28, by=H-70-bh; const need=0.22+FG.dist*0.0115;
    x.fillStyle="rgba(0,0,0,.45)"; x.fillRect(bx,by,bw,bh);
    const p=Math.min(1,FG.power/1.05); const grad=x.createLinearGradient(0,by+bh,0,by); grad.addColorStop(0,"#4cc38a"); grad.addColorStop(.75,gold); grad.addColorStop(1,"#e5322b");
    x.fillStyle=grad; x.fillRect(bx,by+bh*(1-p),bw,bh*p);
    const ny=by+bh*(1-Math.min(1,need/1.05)); x.fillStyle="#fff"; x.fillRect(bx-5,ny-1,bw+10,2);
    x.font='700 11px "Barlow Condensed",system-ui'; x.textAlign="right"; x.fillText("POWER",bx+bw,by-6);
  }
  // ball
  let bx=tee.x, by=tee.y, r=13;
  if(FG.ball){ const t=FG.ball.t, endX=cx+FG.ball.x*gw*1.1, endY=FG.ball.short?baseY+10:upTop-6;
    const arc=Math.sin(Math.PI*t)*H*0.25*(FG.ball.short?0.6:1);
    bx=tee.x+(endX-tee.x)*t; by=tee.y+(endY-tee.y)*t-arc; r=13*(1-0.78*t); }
  x.save(); x.translate(bx,by); x.rotate(FG.ball?FG.ball.t*12:-0.4);
  x.fillStyle="#7a3e1d"; x.beginPath(); x.ellipse(0,0,r*1.25,r*0.8,0,0,7); x.fill();
  x.strokeStyle="#fff"; x.lineWidth=Math.max(1,r*0.12); x.beginPath(); x.moveTo(-r*0.45,0); x.lineTo(r*0.45,0); x.stroke();
  for(let i=-2;i<=2;i++){ x.beginPath(); x.moveTo(i*r*0.18,-r*0.18); x.lineTo(i*r*0.18,r*0.18); x.stroke(); }
  x.restore();
  if(!FG.ball){ x.fillStyle="rgba(0,0,0,.25)"; x.beginPath(); x.ellipse(tee.x,tee.y+12,16,4,0,0,7); x.fill(); }
}

<script>
/* ===================== North Huddle: accounts, branding, live scores ===================== */

/* ---------- account sheet: email + password ---------- */
let AMODE="in";
const _openAcctNH=openAcct;
function authSheet(){
  const up=AMODE==="up";
  return `<div class="sheet-head"><div><div class="label">Optional</div><div class="nm" style="font-size:26px">${up?"Create account":"Sign in"}</div></div><button class="x" id="closeSheet" aria-label="Close">×</button></div>
    <p class="acct-p">Everything on North Huddle works without an account. Sign in to play fantasy with friends, chat, and keep your settings on every device.</p>
    <div class="auth-seg" role="group"><button data-amode="in" aria-pressed="${!up}">Sign in</button><button data-amode="up" aria-pressed="${up}">Create account</button></div>
    <form id="authForm" class="auth-form" novalidate>
      ${up?`<label>Display name<input name="name" maxlength="24" autocomplete="nickname" placeholder="What friends call you" required></label>`:""}
      <label>Email<input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      <label>Password<input name="password" type="password" minlength="6" autocomplete="${up?"new-password":"current-password"}" placeholder="${up?"At least 6 characters":""}" required></label>
      <div class="auth-err" id="authErr" role="alert"></div>
      <button class="btn-gold" type="submit" id="authGo">${up?"Create account":"Sign in"}</button>
    </form>
    ${up?"":`<button class="auth-link" data-aforgot="1">Forgot password?</button>`}
    ${themeRow()}`;
}
openAcct=function(){
  if(ACC.id){
    _openAcctNH();
    const f=[...$("sheet").querySelectorAll(".foot")].find(x=>/sign out/i.test(x.textContent));
    const html=`<button class="tbtn auth-out" data-signout="1">Sign out</button>`;
    if(f) f.outerHTML=html; else $("sheet").insertAdjacentHTML("beforeend",html);
    return;
  }
  $("sheet").innerHTML=authSheet(); $("sheetBg").hidden=false;
  setTimeout(()=>$("authForm")?.querySelector("input")?.focus(),50);
};
document.addEventListener("click",async e=>{
  const m=e.target.closest("[data-amode]"); if(m){ AMODE=m.dataset.amode; $("sheet").innerHTML=authSheet(); $("authForm").querySelector("input").focus(); return; }
  if(e.target.closest("[data-signout]")){ NH.signOut(); return; }
  if(e.target.closest("[data-aforgot]")){
    const em=$("authForm")?.email?.value.trim(); const er=$("authErr");
    if(!em){ er.textContent="Type your email above first, then tap Forgot password."; return; }
    try{ await NH.resetPassword(em); er.textContent="If that email has an account, a reset link is on its way."; }
    catch(x){ er.textContent="Couldn't send a reset email. Ask the site owner to reset your password."; }
  }
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm") return; e.preventDefault(); e.stopImmediatePropagation();
  const f=e.target, er=$("authErr"), go=$("authGo");
  const name=(f.name?.value||"").trim().slice(0,24), email=f.email.value.trim(), pw=f.password.value;
  er.textContent="";
  if(AMODE==="up"&&!name){ er.textContent="Pick a display name."; return; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ er.textContent="Enter a valid email."; return; }
  if(pw.length<6){ er.textContent="Password needs at least 6 characters."; return; }
  go.disabled=true; go.textContent=AMODE==="up"?"Creating…":"Signing in…";
  try{
    if(AMODE==="up"){ const r=await NH.signUp(name,email,pw); if(r==="confirm"){ er.textContent="Check your email to confirm your account, then sign in."; go.disabled=false; go.textContent="Create account"; } }
    else await NH.signIn(email,pw);

// x = yards from OUR goal line (0) to theirs (100). We attack to the right.
function fieldState(lg){
  const opp=lg.home===CUR?lg.away:lg.home;
  const fix=a=>({WAS:"WSH",LA:"LAR"}[a]||a);
  const m=String(lg.posText||"").trim().match(/^([A-Z]{2,4})?\s*(\d{1,2})$/i);
  if(!lg.possession || !m) return null;
  const side=m[1]?fix(m[1].toUpperCase()):"", n=Math.max(0,Math.min(50,Number(m[2])));
  const x = !side||n===50 ? 50 : side===CUR ? n : 100-n;
  const ours=lg.possession===CUR, dir=ours?1:-1;
  const dist=Number(lg.distance)||0;
  const toGoal=ours?100-x:x;
  const fd = dist>0 && dist<toGoal ? x+dir*dist : null;
  return {x, ours, team:lg.possession, opp, fd, dd:lg.shortDD||"", posText:lg.posText, red: toGoal<=20, last:lg.lastPlay||""};
}

// Other teams load in about a second from /api/team (ESPN data via Cloudflare).
// A Claude-built team doc (teams/<abbr>) still wins when it's fresh, since it adds interviews and written summaries.
const QUICK={}, QLOAD={};
async function fetchQuick(a, force){
  if(!a||!TEAMS[a]) return;
  if(!force && QUICK[a] && Date.now()-QUICK[a]._at<10*60e3) return;
  if(QLOAD[a]) return QLOAD[a];
  QLOAD[a]=(async()=>{
    try{ const r=await fetch("/api/team?abbr="+encodeURIComponent(a)); if(r.ok){ const d=await r.json(); if(d&&d.meta){ d._at=Date.now(); QUICK[a]=d; if(a===CUR){ syncView(); renderAll(); } } } }
    catch(e){}
    delete QLOAD[a];
  })();
  return QLOAD[a];
}
function claudeFresh(d){ const u=d?.meta?.updatedAt; return !!u && Date.now()-Date.parse(u)<TEAM_STALE; }
const _teamViewQ=teamView;
teamView=function(a){
  if(a==="MIN") return minBlend(_teamViewQ(a), QUICK.MIN);
  const c=TEAMDOCS[a], q=QUICK[a];
  if(!q || claudeFresh(c)) return _teamViewQ(a);
  // ESPN data, plus anything extra a previous Claude build had (interviews, written news).
  const news=[...(q.news||[])];
  (c?.news||[]).forEach(n=>{ if(!news.some(x=>x.headline===n.headline)) news.push(n); });
  return {meta:q.meta, games:q.games||[], players:q.players||[], injuries:q.injuries||[], depth:q.depth||[], videos:c?.videos||[],
    news:news.sort((x,y)=>String(y.date).localeCompare(String(x.date))).slice(0,20),
    standings:(LEAGUE.standings||{})[TEAMS[a][2]]||[]};
};
// Minnesota: Claude's content stays, ESPN keeps the facts current between Claude updates.
const nmz=s=>String(s||"").toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b\.?/g,"").replace(/[^a-z]/g,"");
function minBlend(v,q){
  if(!q) return v;
  const out={...v};
  const m=v.meta||{}, qm=q.meta||{};
  out.meta={...m};
  ["record","recordHome","recordAway","streak","pf","pa"].forEach(k=>{ if(qm[k]!=null&&qm[k]!=="") out.meta[k]=qm[k]; });
  if(!m.updatedAt||Date.parse(qm.updatedAt)>Date.parse(m.updatedAt)) out.meta.liveAt=qm.updatedAt;
  // games: take ESPN's result/score/kickoff when it knows more
  const qg=Object.fromEntries((q.games||[]).map(g=>[g.week,g]));
  out.games=(v.games||[]).map(g=>{ const e=qg[g.week]; if(!e||e.status==="bye") return g; const n={...g};
    if(e.status==="final"&&g.status!=="final"){ n.status="final"; n.us=e.us; n.them=e.them; n.result=e.result; }
    if(!n.kickoff&&e.kickoff) n.kickoff=e.kickoff; if(!n.tv&&e.tv) n.tv=e.tv;
    return n; });
  // injuries: Claude's (with body parts) plus anything new ESPN lists (skip long-term IR Claude didn't mention)
  const inj=[...(v.injuries||[])], have=new Set(inj.map(i=>nmz(i.player)));
  (q.injuries||[]).forEach(i=>{ if(!have.has(nmz(i.player)) && !/reserve/i.test(i.status)) inj.push(i); });
  out.injuries=inj;
  // players: season totals only go up, so keep the larger number from either source
  const qp=Object.fromEntries((q.players||[]).map(p=>[nmz(p.name),p]));
  out.players=(v.players||[]).map(p=>{ const e=qp[nmz(p.name)]; if(!e) return p; const s=JSON.parse(JSON.stringify(p.stats||{}));
    for(const [grp,keys] of Object.entries({pass:["yds","td","cmp","att","int"],rush:["yds","td","att"],rec:["rec","yds","td"],def:["tkl","sacks","int"]})){
      if(!e.stats?.[grp]) continue; s[grp]=s[grp]||{}; keys.forEach(k=>{ const a=Number(s[grp][k]||0), b=Number(e.stats[grp][k]||0); if(b>a) s[grp][k]=b; }); }
    const n={...p, stats:s}; n.rank=(s.pass?.yds||0)+(s.rush?.yds||0)+(s.rec?.yds||0)+5*(s.def?.tkl||0)+20*(s.def?.sacks||0); return n; });
  // news: add ESPN headlines Claude hasn't covered
  const news=[...(v.news||[])], heads=new Set(news.map(n=>nmz(n.headline)));
  (q.news||[]).forEach(n=>{ if(!heads.has(nmz(n.headline))) news.push(n); });
  out.news=news.sort((x,y)=>String(y.date).localeCompare(String(x.date)));
  return out;
}

/* ---------- predictions ---------- */
const PRED={all:[], unsub:null};
function predScore(p,g){
  if(!g||g.status!=="final"||g.us==null) return null;
  const err=Math.abs(p.us-g.us)+Math.abs(p.them-g.them);
  const sgn=x=>x>0?1:x<0?-1:0, winner=sgn(p.us-p.them)===sgn(g.us-g.them);
  return (winner?5:0)+Math.max(0,10-Math.round(err/2))+(err===0?5:0);
}
function predFor(g){ const k=gameKey(g); return PRED.all.filter(p=>p.game===k&&p.kind!=="pick"); }
function picksFor(g){ const k=gameKey(g); return PRED.all.filter(p=>p.game===k&&p.kind==="pick"); }
function winPickHtml(g,locked){
  const k=gameKey(g), picks=picksFor(g), mine=picks.find(p=>p.uid===ACC.id)?.pick;
  const sides=[CUR,g.oppAbbr], n={}; sides.forEach(a=>n[a]=picks.filter(p=>p.pick===a));
  const total=picks.length, pct=a=>total?Math.round(n[a].length/total*100):0;
  const winner=g.status==="final"&&g.us!=null?(g.us>g.them?CUR:g.us<g.them?g.oppAbbr:""):"";
  const name=a=>a===CUR?NICK():(oppName(g).split(" ").slice(-1)[0]);
  const btn=a=>`<button class="wp-pick${mine===a?" mine":""}${winner===a?" won":""}" ${locked||!ACC.id?"disabled":""} data-winpick="${esc(k)}" data-pickteam="${esc(a)}" aria-pressed="${mine===a}">
      ${badge(a)}<span class="wpk-name">${esc(name(a))}</span>${total?`<span class="wpk-pct num">${pct(a)}%</span>`:""}${winner===a?'<span class="wpk-won">✓</span>':""}</button>`;
  const who=a=>n[a].length?`<div class="wpk-who"><span class="wpk-avs">${n[a].slice(0,8).map(p=>av(p.uid)).join("")}</span><span class="t2">${n[a].slice(0,3).map(p=>`<span data-uname="${esc(p.uid)}">${esc(personName(p.uid))}</span>`).join(", ")}${n[a].length>3?` +${n[a].length-3}`:""}</span></div>`:`<div class="wpk-who t2">No picks yet</div>`;
  const bar=total?`<div class="wpk-bar"><span style="width:${pct(CUR)}%"></span></div>`:"";
  const note=!ACC.id&&!locked?`<button class="tbtn" data-acct="1">Sign in to pick</button>`:`<div class="t2">${locked?(total?`${total} ${total===1?"pick":"picks"} · locked at kickoff`:"Picks are locked"):(mine?"Tap the other team to switch":"Tap a team to make your pick")}${total&&!locked?` · ${total} ${total===1?"pick":"picks"}`:""}</div>`;
  return `<div class="wpk"><div class="label">Who wins?</div><div class="wpk-btns">${btn(CUR)}${btn(g.oppAbbr)}</div>${bar}<div class="wpk-whos">${who(CUR)}${who(g.oppAbbr)}</div>${note}</div>`;
}
function predCardHtml(){
  const g=nextGameForPred(); if(!g) return "";
  const k=gameKey(g), mine=PRED.all.find(p=>p.game===k&&p.uid===ACC.id&&p.kind!=="pick"), list=predFor(g);
  const locked=Date.now()>=Date.parse(g.kickoff)||g.status!=="scheduled";
  const vs=`${g.home?"vs":"at"} ${esc(oppName(g))}`;
  let body;
  if(!locked){
    if(!ACC.db||!ACC.id) body=`<p class="t2">Guess the final score before kickoff. Closest fans climb the season leaderboard.</p><button class="btn-gold" data-acct="1">Sign in to predict</button>`;
    else body=`<form class="pred-form" data-pred="${esc(k)}"><label>${badge(CUR)}<input name="us" type="number" inputmode="numeric" min="0" max="99" value="${mine?mine.us:""}" required aria-label="${esc(CUR)} points"></label><span class="pred-dash">–</span><label><input name="them" type="number" inputmode="numeric" min="0" max="99" value="${mine?mine.them:""}" required aria-label="${esc(g.oppAbbr)} points">${badge(g.oppAbbr)}</label><button class="btn-gold" type="submit">${mine?"Update":"Lock it in"}</button></form>
      <div class="t2">Locks at kickoff · ${esc(fmtDate(g.kickoff,{weekday:"short",hour:"numeric",minute:"2-digit"}))} CT${list.length?` · ${list.length} ${list.length===1?"fan has":"fans have"} predicted`:""}</div>`;
  } else {
    const sorted=list.slice().sort((a,b)=>{ if(g.us==null) return 0; const ea=Math.abs(a.us-g.us)+Math.abs(a.them-g.them), eb=Math.abs(b.us-g.us)+Math.abs(b.them-g.them); return ea-eb; });
    body=list.length?`<div class="list pred-list">${sorted.slice(0,10).map((p,i)=>`<div class="row">${av(p.uid)}<div class="grow"><div class="t1" data-uname="${esc(p.uid)}">${esc(personName(p.uid))}</div></div><b class="num">${esc(p.us)}–${esc(p.them)}</b>${predScore(p,g)!=null?`<span class="chip pos">+${predScore(p,g)}</span>`:""}</div>`).join("")}</div>`

}
function openPredLeaderboard(){
  const games=Object.fromEntries(S.games.map(g=>[gameKey(g),g])), tot={};

function lpFind(name,abbr){ if(!LP.idx) return null; return abbr?(LP.idx[nmz(name)+"|"+abbr]||null):(LP.idx[nmz(name)]||null); }

  if(typeof PRED==="undefined") return;

  PRED.all.forEach(p=>{

function srScore(text,q){ const t=text.toLowerCase(); if(t===q) return 100; if(t.startsWith(q)) return 80; if(t.split(/[^a-z0-9]+/).some(w=>w.startsWith(q))) return 60; if(t.includes(q)) return 40; return 0; }
function searchAll(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];
  const out=[], add=(item,score)=>{ if(score>0) out.push({...item,score}); };
  sections().forEach(s=>add(s,Math.max(srScore(s.label,q),srScore(s.kw,q)*.9)));
  Object.entries(TEAMS).forEach(([a,t])=>add({type:"Team",label:`${t[0]} ${t[1]}`,sub:t[2],badge:a,act:()=>{ closeSearch(); setTeam(a); setTab("home"); }},Math.max(srScore(`${t[0]} ${t[1]}`,q),srScore(t[1],q),a.toLowerCase()===q?95:0)));
  (S.players||[]).forEach(p=>add({type:"Player",label:p.name,sub:`${p.pos||""} · ${NICK()}`,badge:CUR,act:()=>{ closeSearch(); setTab("players"); openPlayer(p.id); }},(sc=>sc?sc+5:0)(srScore(p.name,q))));
  if(LP.data) Object.entries(LP.data.teams||{}).forEach(([a,ps])=>{ if(a===CUR) return; ps.forEach(p=>add({type:"Player",label:p.name,sub:`${p.pos||""} · ${TEAMS[a]?.[1]||a}`,badge:a,act:()=>{ closeSearch(); openLeaguePlayer(a,p.name); }},srScore(p.name,q))); });
  (S.news||[]).forEach(n=>add({type:"News",label:n.headline,sub:`${n.source||""} · ${ago(n.date)}`,act:()=>{ closeSearch(); if(n.url) window.open(n.url,"_blank","noopener"); else setTab("news"); }},srScore(n.headline,q)*.8));
  (S.games||[]).filter(g=>g.opp).forEach(g=>add({type:"Game",label:`Week ${g.week}: ${g.home?"vs":"at"} ${g.opp}`,sub:g.status==="final"?`${g.result||""} ${g.us}-${g.them}`:g.kickoff?fmtDate(g.kickoff,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"",badge:g.oppAbbr,act:()=>{ closeSearch(); setTab("games"); GM.mode="team"; renderGames(); }},Math.max(srScore(g.opp,q),srScore(`week ${g.week}`,q))*.85));
  const seen=new Set();
  return out.sort((a,b)=>b.score-a.score).filter(r=>{ const k=r.type+r.label+(r.badge||""); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,14);
}

const looksLikeQuestion=q=>/\?$|^(who|what|when|where|why|how|is|are|can|should|will|do|does|did|which|tell|explain)\b/i.test(q.trim());
function renderSearch(){

  const empty=!SR.aiMode&&!q&&!SR.ai.msgs.length?`<div class="sv-tips"><div class="sv-h">Try</div>${["Justin Jefferson","Standings","Packers","Sleeper","When is the next game?","What is a safety in football?"].map(s=>`<button class="chip sv-chip" data-svq="${esc(s)}">${esc(s)}</button>`).join("")}${SR.ai.ready===false?"":`<p class="t2">Type a question and press Enter to ask <b>Huddle AI</b>, the site's assistant.</p>`}</div>`:"";
  const aiHello=SR.aiMode&&!SR.ai.msgs.length?`<div class="ai-hello"><div class="ai-badge">${ICO_SPARK}</div><div class="t1">Ask Huddle AI</div><p class="t2">Your football assistant. It knows the site's latest scores, schedule, stats, injuries and standings, and can explain rules and fantasy strategy.</p>${SR.ai.ready===false?'<p class="t2"><b>The assistant is being set up.</b> Check back soon!</p>':["When is the next Vikings game?","Who leads the team in receiving yards?","Who's injured right now?","Explain what a two-point conversion is","Who should I start in fantasy this week?"].map(x=>`<button class="sv-row sv-sugg" data-svq="${esc(x)}">${ICO_SPARK}<span>${esc(x)}</span></button>`).join("")}</div>`:"";
  b.innerHTML=aiHello+chat+(SR.aiMode?"":aiRow)+(q&&!res.length?`<div class="t2 sv-none">No matches on the site for “${esc(q)}”.</div>`:"")+rows+empty;

/* ---------- Huddle AI ---------- */
async function aiReady(){ if(SR.ai.ready!==null) return SR.ai.ready; try{ const r=await fetch("/api/ask"); const d=await r.json(); SR.ai.ready=!!d.ready; }catch(e){ SR.ai.ready=false; } if(SR.open) renderSearch(); return SR.ai.ready; }
function aiContext(){
  const m=S.meta||{}, L=[];
  L.push(`Team being viewed: ${TEAMS[CUR][0]} ${TEAMS[CUR][1]} (${CUR}). Record ${m.record||"?"} (home ${m.recordHome||"?"}, away ${m.recordAway||"?"}), ${m.divisionRank||""}, streak ${m.streak||"?"}, points for ${m.pf??"?"}, against ${m.pa??"?"}.`);
  if(m.alert) L.push(`Top headline: ${m.alert}`);
  L.push("Schedule: "+(S.games||[]).map(g=>g.status==="bye"?`Wk${g.week} BYE`:`Wk${g.week} ${g.home?"vs":"at"} ${g.oppAbbr} ${g.status==="final"?`${g.result} ${g.us}-${g.them}`:g.status==="live"?`LIVE ${g.us}-${g.them} ${g.note||""}`:(g.kickoff?new Date(g.kickoff).toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" CT":"")}${g.tv?" "+g.tv:""}`).join("; "));
  L.push("Players (season stats): "+(S.players||[]).slice(0,30).map(p=>{ const s=p.stats||{}, x=[]; if(s.pass) x.push(`${s.pass.cmp}/${s.pass.att} ${s.pass.yds} pass yds ${s.pass.td} TD ${s.pass.int} INT`); if(s.rush?.yds) x.push(`${s.rush.att??"?"} car ${s.rush.yds} rush yds ${s.rush.td} TD`); if(s.rec?.yds) x.push(`${s.rec.rec} rec ${s.rec.yds} yds ${s.rec.td} TD`); if(s.def&&(s.def.tkl||s.def.sacks)) x.push(`${s.def.tkl} tkl ${s.def.sacks} sacks ${s.def.int} INT`); if(s.kick) x.push(`FG ${s.kick.fgm}/${s.kick.fga}`); return `${p.name} (${p.pos}${p.status?", "+p.status:""}): ${x.join(", ")||"no stats"}`; }).join(" | "));
  if(S.injuries?.length) L.push("Injuries: "+S.injuries.slice(0,15).map(i=>`${i.player} ${i.pos} – ${i.status}${i.injury?" ("+i.injury+")":""}`).join("; "));
  if(S.depth?.length) L.push("Starters: "+S.depth.filter(d=>d.unit!=="special").map(d=>`${d.pos} ${d.players?.[0]||""}`).join(", "));
  if(S.news?.length) L.push("Recent news: "+S.news.slice(0,10).map(n=>`${n.headline}${n.summary?" — "+n.summary:""} (${ago(n.date)})`).join(" | "));
  const D=GM.stand?.divisions||LEAGUE.standings; if(D){ const div=D[TEAMS[CUR][2]]; if(div) L.push(`${TEAMS[CUR][2]} standings: `+div.map(r=>`${r.abbr} ${r.w}-${r.l}${r.t?"-"+r.t:""}`).join(", ")); const seeds=Object.values(D).flat().filter(r=>r.seed&&r.seed<=7); if(seeds.length) L.push("Playoff seeds: "+["NFC","AFC"].map(c=>c+": "+Object.entries(D).filter(([n])=>n.startsWith(c)).flatMap(([,rs])=>rs).filter(r=>r.seed&&r.seed<=7).sort((a,b)=>a.seed-b.seed).map(r=>`${r.seed}.${r.abbr}`).join(" ")).join("; ")); }
  const lg=LIVE.data?.games; if(lg?.length) L.push(`This week's NFL games (week ${LIVE.data.week||"?"}): `+lg.map(x=>`${x.away} ${x.state==="pre"?"":x.as} @ ${x.home} ${x.state==="pre"?"":x.hs} (${x.state==="pre"?new Date(x.kickoff).toLocaleString("en-US",{timeZone:"America/Chicago",weekday:"short",hour:"numeric",minute:"2-digit"})+" CT":x.detail})`).join("; "));
  const wk=typeof fdoc==="function"?fdoc("week"):null; if(wk) L.push(`Fantasy ${wk.title||""}: ${wk.summary||""} Byes: ${(wk.byes||[]).join(", ")}`);
  return L.join("\n");
}
async function askAI(q){
  if(!q||SR.ai.busy) return;
  if(SR.ai.ready===false) return toast("The assistant isn't turned on yet.");
  SR.ai.msgs.push({role:"user",content:q}); SR.ai.busy=true; $("svInput").value=""; SR.q=""; renderSearch();
  try{
    const r=await fetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({q, context:aiContext(), history:SR.ai.msgs.slice(0,-1).slice(-6)})});
    const d=await r.json().catch(()=>({}));
    SR.ai.msgs.push({role:"assistant",content:d.answer||(d.error==="rate_limited"?"You've asked a lot this hour. Try again a bit later!":d.error==="not_configured"?"The assistant isn't turned on yet.":"Sorry, I couldn't answer that right now. Try again in a moment.")});
  }catch(e){ SR.ai.msgs.push({role:"assistant",content:"Sorry, I couldn't reach the assistant. Check your connection and try again."}); }
  SR.ai.busy=false; if(SR.open) renderSearch();
}

const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const ICO_MIC=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const ICO_SPEAK=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const VOICE={rec:null, on:false, speak:store.get("nh_speak")==="1"};
function micButtons(){
  const box=document.querySelector("#searchView .sv-box"); if(!box||box.querySelector(".sv-mic")) return;
  if(SpeechRec) box.insertAdjacentHTML("beforeend",`<button class="sv-mic" data-mic="1" aria-label="Ask by voice" title="Ask by voice">${ICO_MIC}</button>`);
  if("speechSynthesis" in window) box.insertAdjacentHTML("beforeend",`<button class="sv-spk${VOICE.speak?" on":""}" data-speak="1" aria-label="Read answers out loud" aria-pressed="${VOICE.speak}" title="Read answers out loud">${ICO_SPEAK}</button>`);
}
function startVoice(){
  if(!SpeechRec) return toast("Voice isn't supported in this browser. Try Chrome.");
  if(VOICE.on){ VOICE.rec?.stop(); return; }
  const r=new SpeechRec(); VOICE.rec=r; r.lang="en-US"; r.interimResults=true; r.maxAlternatives=1;
  const inp=$("svInput"), mic=document.querySelector(".sv-mic"); let finalText="";
  r.onstart=()=>{ VOICE.on=true; mic?.classList.add("listening"); inp.placeholder="Listening… ask your question"; };
  r.onresult=e=>{ let t=""; for(let i=0;i<e.results.length;i++){ t+=e.results[i][0].transcript; if(e.results[i].isFinal) finalText=t; } inp.value=t; SR.q=t; if(!SR.aiMode) renderSearch(); };
  r.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") toast("Allow microphone access to ask by voice."); else if(e.error==="no-speech") toast("Didn't catch that. Tap the mic and try again."); };
  r.onend=()=>{ VOICE.on=false; mic?.classList.remove("listening"); inp.placeholder=SR.aiMode?"Ask Huddle AI anything about football…":"Search players, teams, news… or ask a question"; const q=(finalText||inp.value).trim(); if(q){ SR.aiMode=true; askAI(q); } };
  try{ r.start(); }catch(e){ toast("Couldn't start the microphone."); }
}
function speakAnswer(text){
  if(!VOICE.speak||!("speechSynthesis" in window)||!text) return;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=1.03; speechSynthesis.speak(u);
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-mic]")){ e.preventDefault(); startVoice(); return; }
  const s=e.target.closest("[data-speak]"); if(s){ e.preventDefault(); VOICE.speak=!VOICE.speak; store.set("nh_speak",VOICE.speak?"1":"0"); s.classList.toggle("on",VOICE.speak); s.setAttribute("aria-pressed",String(VOICE.speak)); if(!VOICE.speak) speechSynthesis.cancel(); else toast("Huddle AI will read answers out loud."); }
  if(e.target.closest("[data-svclose]")&&"speechSynthesis" in window) speechSynthesis.cancel();
});
const _openSearchV=openSearch;
openSearch=function(prefill,ai){ _openSearchV(prefill,ai); micButtons(); };
const _askAIV=askAI;
askAI=async function(q){ const n=SR.ai.msgs.length; await _askAIV(q); const last=SR.ai.msgs[SR.ai.msgs.length-1]; if(SR.ai.msgs.length>n&&last?.role==="assistant") speakAnswer(last.content); };
// mic shortcut right on the header bar
(function(){ const f=$("searchBtn"); if(f&&SpeechRec&&!document.querySelector(".hs-mic")) f.insertAdjacentHTML("beforeend",`<span class="hs-mic" data-hsmic="1" role="button" aria-label="Ask by voice">${ICO_MIC}</span>`); })();

/* ---------- admin tab ---------- */
const ACT={rows:[], err:"", loading:false, days:7};
async function loadActivity(){
  ACT.loading=true; ACT.err="";
  const since=new Date(Date.now()-ACT.days*864e5).toISOString();
  const {data,error}=await NH.sb.from("visits").select("at,uid,device,kind,app,team").gte("at",since).order("at",{ascending:false}).limit(1000);
  if(error) ACT.err=/visits|relation|schema/i.test(error.message)?"setup":error.message; else ACT.rows=data||[];
  ACT.loading=false; if(ADM.tab==="activity") renderAdmin();
}
function actName(r){ if(r.uid){ const u=ADM.users.find(x=>x.id===r.uid); return u?.name||(u?.email||"").split("@")[0]||"Member"; } return "Guest "+String(r.device||"").slice(0,4).toUpperCase(); }
function admActivity(){
  if(ACT.err==="setup") return `<div class="card"><b>One-time setup needed.</b><p class="acct-p">Copy github.com/TheOldMan21/north-huddle/blob/main/supabase/activity.sql and run it in Supabase → SQL Editor. Then tap Refresh.</p></div>`;
  if(ACT.err) return `<div class="card empty">Couldn't load activity: ${esc(ACT.err)}</div>`;
  if(ACT.loading&&!ACT.rows.length) return skelRows(5);
  const rows=ACT.rows.filter(r=>!(r.uid&&ADM.users.find(u=>u.id===r.uid&&/huddlebot@/i.test(u.email))));
  const dayKey=t=>new Date(t).toLocaleDateString("en-US",{timeZone:"America/Chicago"});
  const today=dayKey(Date.now()), todays=rows.filter(r=>dayKey(r.at)===today);
  const uniq=a=>new Set(a.map(r=>r.uid||("g"+r.device))).size;
  const members=new Set(rows.filter(r=>r.uid).map(r=>r.uid)).size, guests=new Set(rows.filter(r=>!r.uid).map(r=>r.device)).size;
  const stats=`<div class="adm-stats">${[["Visitors today",uniq(todays)],["Visits today",todays.length],[`Visitors (${ACT.days} days)`,uniq(rows)],["Members / guests",`${members} / ${guests}`]].map(([l,v])=>`<div class="adm-stat"><b class="num">${v}</b><span>${l}</span></div>`).join("")}</div>`;
  // per-day bar list
  const days=[]; for(let i=ACT.days-1;i>=0;i--){ const d=dayKey(Date.now()-i*864e5); days.push([d, uniq(rows.filter(r=>dayKey(r.at)===d))]); }
  const max=Math.max(1,...days.map(d=>d[1]));
  const chart=`<div class="card act-days">${days.map(([d,n])=>`<div class="act-day"><span class="act-d">${esc(new Date(d).toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"}))}</span><span class="act-bar"><span style="width:${n/max*100}%"></span></span><b class="num">${n}</b></div>`).join("")}</div>`;
  // latest visits, newest first (collapse repeats from the same person within an hour)
  const seen={}, list=[];
  rows.forEach(r=>{ const k=r.uid||r.device; if(seen[k]&&Date.parse(seen[k])-Date.parse(r.at)<36e5) return; seen[k]=r.at; list.push(r); });
  const avatar=r=>{ const u=r.uid&&ADM.users.find(x=>x.id===r.uid); return `<img class="av" src="${esc(u?.photo||BLANK_AV)}" alt="">`; };
  const feed=list.slice(0,150).map(r=>`<div class="row act-row">${avatar(r)}<div class="grow"><div class="t1">${esc(actName(r))}${r.uid?"":' <span class="chip">guest</span>'}</div><div class="t2">${esc(r.kind||"Device")}${r.app?" · app":""}${r.team&&r.team!=="MIN"?" · viewing "+esc(r.team):""}</div></div><div class="act-when"><div class="t1 num">${esc(new Date(r.at).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"}))}</div><div class="t2">${esc(dayKey(r.at)===today?"Today":new Date(r.at).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"America/Chicago"}))}</div></div></div>`).join("");
  return stats+`<div class="sb-head"><h2>Visitors per day</h2><div class="auth-seg act-range">${[1,7,30].map(d=>`<button data-actdays="${d}" aria-pressed="${ACT.days===d}">${d===1?"Today":d+" days"}</button>`).join("")}</div></div>${chart}<h2>Who opened the site</h2><div class="list">${feed||'<div class="card empty">No visits yet in this period.</div>'}</div><div class="foot">Members show by name. Guests (not signed in) show as a random code per device, with no personal info. Times are Central.</div>`;
}

  document.body.insertAdjacentHTML("beforeend",`<div class="install-bar ios-bar" id="installBar" role="region" aria-label="Add to Home Screen"><img src="/apple-touch-icon.png" alt=""><div class="grow"><b>Add North Huddle to your iPhone</b><span>Tap ${ICO_IOS_SHARE} <b>Share</b> below, then <b>Add to Home Screen</b>. Needed for game alerts.</span></div><button class="x" data-install-x="1" aria-label="Dismiss">×</button></div>`);
}
if(IOS) setTimeout(()=>iosInstallHint(false),4000);
const _doInstallI=doInstall;
doInstall=function(){ if(IOS) return iosInstallHint(true); return _doInstallI(); };

/* alerts panel: on iPhone, notifications only work from the Home Screen app (iOS 16.4+) */
const _pushPanelI=pushPanel;
pushPanel=function(){
  if(IOS&&!IOS_STANDALONE) return `<div class="card push-panel"><div class="t1">${ICO_BELL} Game alerts</div><div class="t2">On iPhone, alerts work from the Home Screen app:</div><ol class="ios-steps"><li>Tap ${ICO_IOS_SHARE} <b>Share</b> at the bottom of Safari</li><li>Choose <b>Add to Home Screen</b> → <b>Add</b></li><li>Open North Huddle from your Home Screen and turn on alerts here</li></ol><div class="t2">Requires iOS 16.4 or newer.</div></div>`;
  return _pushPanelI();
};

/* voice: if the browser can't do speech-to-text (or it's blocked), use the keyboard's dictation mic */
function iosDictationHint(){ const i=$("svInput"); if(i){ i.focus(); } toast("Tap the 🎤 microphone on your keyboard and ask your question.",6000); }
const _micButtonsI=micButtons;
micButtons=function(){
  _micButtonsI();
  const box=document.querySelector("#searchView .sv-box");
  if(IOS&&box&&!box.querySelector(".sv-mic")) box.querySelector(".sv-spk")?.insertAdjacentHTML("beforebegin",`<button class="sv-mic" data-mic="1" aria-label="Ask by voice">${ICO_MIC}</button>`);
};
const _startVoiceI=startVoice;
startVoice=function(){
  if(!SpeechRec) return IOS?iosDictationHint():toast("Voice isn't supported in this browser. Try Chrome.");
  _startVoiceI();
  // iPhone home-screen apps often block speech recognition; fall back to keyboard dictation
  if(IOS&&VOICE.rec){ const r=VOICE.rec, prev=r.onerror; r.onerror=e=>{ if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)) iosDictationHint(); else prev&&prev(e); }; }
};
// header mic on iPhone even without speech recognition
(function(){ const f=$("searchBtn"); if(IOS&&f&&!f.querySelector(".hs-mic")) f.insertAdjacentHTML("beforeend",`<span class="hs-mic" data-hsmic="1" role="button" aria-label="Ask by voice">${ICO_MIC}</span>`); })();
// in the AI screen, Enter on the iPhone keyboard ("Go") sends to the assistant (dictation ends with Go)

/* ===================== North Huddle: admin page (site owner only) ===================== */
const ADM={tab:"members", users:[], chat:[], leagues:[], loading:false, err:"", arm:null};
function admDate(t){ return t?fmtDate(t,{month:"short",day:"numeric",year:"numeric"}):"—"; }
function admAgo(t){ return t?ago(t):"never"; }
async function admLoad(){
  ADM.loading=true; ADM.err=""; renderAdmin();
  try{
    const [u,c,l]=await Promise.all([
      NH.sb.rpc("admin_users"),
      ACC.db.collection("chat").orderBy("t","desc").limit(150).get(),
      ACC.db.collection("leagues").get()
    ]);
    if(u.error) throw u.error;
    ADM.users=u.data||[]; ADM.chat=c.docs.map(d=>({id:d.id,...d.data()})); ADM.leagues=l.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ ADM.err=/admin_users|function|not_admin|schema cache/i.test(String(e?.message||e))?"setup":String(e?.message||e); }
  ADM.loading=false; renderAdmin();
}
function admName(uid){ const u=ADM.users.find(x=>x.id===uid); return u?.name||(u?.email||"").split("@")[0]||personName(uid); }
function admAv(u){ return `<img class="av" src="${esc(u.photo||BLANK_AV)}" alt="">`; }
function admArm(key,label,armed){ return ADM.arm===key?`<button class="tbtn adm-danger" data-adm-go="${esc(key)}">Tap to confirm</button>`:`<button class="tbtn" data-adm-arm="${esc(key)}">${label}</button>`; }
function admMembers(){
  const now=Date.now(), wk=7*864e5, real=ADM.users.filter(u=>!/huddlebot@/i.test(u.email));
  const newWk=real.filter(u=>now-Date.parse(u.created_at)<wk).length, act=real.filter(u=>u.last_sign_in_at&&now-Date.parse(u.last_sign_in_at)<wk).length;
  const chatDay=ADM.chat.filter(m=>now-Date.parse(m.t)<864e5).length;
  const stats=`<div class="adm-stats">${[["Members",real.length],["New this week",newWk],["Active this week",act],["Chats today",chatDay]].map(([l,v])=>`<div class="adm-stat"><b class="num">${v}</b><span>${l}</span></div>`).join("")}</div>`;
  const rows=real.map(u=>`<div class="row adm-user">${admAv(u)}<div class="grow"><div class="t1">${esc(u.name||"(no name)")}${u.is_admin?' <span class="chip pos">ADMIN</span>':""}${u.banned?' <span class="chip live">BANNED</span>':""}</div>
      <div class="t2">${esc(u.email)}</div><div class="t2">Joined ${esc(admDate(u.created_at))} · Last visit ${esc(admAgo(u.last_sign_in_at))}</div>
      <div class="adm-badges"><span class="t2">Badges:</span>${[["vip","VIP"],["donor","Donor"]].map(([k,l])=>`<button class="adm-bt${(typeof BADGES!=="undefined"&&BADGES[u.id]?.[k])?" on":""}" data-admbadge="${k}" data-uid="${esc(u.id)}" aria-pressed="${!!(typeof BADGES!=="undefined"&&BADGES[u.id]?.[k])}">${k==="vip"?ICO_STAR:ICO_HEART}${l}</button>`).join("")}</div></div>
      ${u.is_admin?"":u.banned?`<button class="tbtn" data-adm-unban="${esc(u.id)}">Unban</button>`:admArm("ban:"+u.id,"Ban")}</div>`).join("");
  return stats+`<h2>Members</h2><div class="list">${rows||`<div class="card empty">No members yet. Share the site link with friends!</div>`}</div>
    <div class="foot">Banned members can still view the site but can't chat, post or play. To delete an account completely, use Supabase → Authentication → Users.</div>`;
}
function admChat(){
  const rows=ADM.chat.map(m=>`<div class="row"><div class="grow"><div class="t2"><b>${esc(admName(m.uid))}</b> · ${esc(admAgo(m.t))}</div><div class="t1 adm-msg">${esc(m.text)}</div></div>${admArm("msg:"+m.id,"Delete")}</div>`).join("");
  return `<h2>Fan chat · latest ${ADM.chat.length}</h2><div class="list">${rows||`<div class="card empty">No messages yet.</div>`}</div>`;
}
function admLeagues(){
  const rows=ADM.leagues.map(L=>`<div class="card adm-lg"><div class="adm-lg-h"><div><div class="t1">${esc(L.name||L.id)}</div><div class="t2">Code ${esc(L.id)} · ${esc(L.status||"setup")} · ${(L.members||[]).length}/${esc(L.size||"?")} teams</div></div>${admArm("lg:"+L.id,"Delete")}</div>
      <div class="t2">Commissioner: <b>${esc(admName(L.commish))}</b></div>
      <div class="adm-chips">${(L.members||[]).map(u=>`<span class="chip">${esc(L.teams?.[u]?.name||admName(u))} · ${esc(admName(u))}</span>`).join("")}</div></div>`).join("");
  return `<h2>Fantasy leagues</h2>${rows||`<div class="card empty">No leagues yet.</div>`}`;
}
function admPolls(){
  const ps=(typeof POLL!=="undefined"?POLL.polls:[]).slice().sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  const form=`<form class="card adm-pollf" id="admPollForm"><div class="t1">New poll</div><input name="q" maxlength="120" placeholder="Question, e.g. Who's the MVP so far?" required>
    ${[1,2,3,4].map(i=>`<input name="o${i}" maxlength="60" placeholder="Answer ${i}${i>2?" (optional)":""}" ${i<=2?"required":""}>`).join("")}
    <button class="btn-gold" type="submit">Post poll</button><div class="t2">New polls show on everyone's Home page. Posting a new one replaces the current poll there.</div></form>`;
  const list=ps.map(p=>{ const vs=POLL.votes.filter(v=>v.poll===p.id), tot=vs.length;
    return `<div class="card adm-lg"><div class="adm-lg-h"><div><div class="t1">${esc(p.q)}</div><div class="t2">${tot} votes · ${p.open===false?"Closed":"Open"} · ${esc(admDate(p.t))}</div></div>${admArm("poll:"+p.id,"Delete")}</div>
      ${(p.options||[]).map((o,i)=>{ const n=vs.filter(v=>v.choice===i).length; return `<div class="t2">${esc(o)}: <b>${n}</b>${tot?` (${Math.round(n/tot*100)}%)`:""}</div>`; }).join("")}
      <button class="tbtn" data-pollopen="${esc(p.id)}" data-open="${p.open===false?"1":"0"}">${p.open===false?"Reopen":"Close voting"}</button></div>`; }).join("");
  return form+`<h2>Polls</h2>`+(list||`<div class="card empty">No polls yet.</div>`);
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="admPollForm") return; e.preventDefault(); e.stopImmediatePropagation();
  const f=e.target, q=f.q.value.trim(), options=[f.o1,f.o2,f.o3,f.o4].map(x=>x.value.trim()).filter(Boolean);
  if(!q||options.length<2) return toast("Add a question and at least two answers.");
  try{ for(const p of POLL.polls.filter(p=>p.open!==false)) await ACC.db.doc("polls/"+p.id).update({open:false});
    await ACC.db.collection("polls").add({q, options, open:true, t:nowIso()}); f.reset(); toast("Poll posted!"); }catch(err){ toast("Couldn't post the poll."); }
},true);
document.addEventListener("click",async e=>{ const b=e.target.closest("[data-pollopen]"); if(!b) return; try{ await ACC.db.doc("polls/"+b.dataset.pollopen).update({open:b.dataset.open==="1"}); }catch(err){ toast("Couldn't update the poll."); } });
function renderAdmin(){
  const ov=$("adminView"); if(!ov) return;
  const body=ov.querySelector(".adm-body");
  ov.querySelectorAll("[data-adm-tab]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.admTab===ADM.tab)));
  if(ADM.loading&&!ADM.users.length){ body.innerHTML=skelRows(5); return; }
  if(ADM.err==="setup"){ body.innerHTML=`<div class="card"><b>One-time setup needed.</b><p class="acct-p">Open github.com/TheOldMan21/north-huddle/blob/main/supabase/admin.sql, copy it, and run it in Supabase → SQL Editor → New query. Then tap Refresh.</p></div>`; return; }
  if(ADM.err){ body.innerHTML=`<div class="card empty">Couldn't load: ${esc(ADM.err)}</div>`; return; }
  body.innerHTML=ADM.tab==="members"?admMembers():ADM.tab==="chat"?admChat():ADM.tab==="polls"?admPolls():ADM.tab==="activity"?admActivity():admLeagues();
}
function openAdmin(){
  let ov=$("adminView");
  if(!ov){
    ov=document.createElement("div"); ov.id="adminView"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label","Admin");
    ov.innerHTML=`<div class="adm-top"><div class="adm-title">Admin</div><button class="tbtn" data-adm-refresh="1">Refresh</button><button class="x" data-adm-close="1" aria-label="Close">×</button></div>
      <div class="auth-seg adm-tabs" role="group"><button data-adm-tab="members">Members</button><button data-adm-tab="activity">Activity</button><button data-adm-tab="chat">Chat</button><button data-adm-tab="leagues">Leagues</button><button data-adm-tab="polls">Polls</button></div>
      <div class="adm-body"></div>`;
    document.body.appendChild(ov);
  }
  ov.hidden=false; document.body.classList.add("adm-open"); closeSheet&&closeSheet(); admLoad();
}
function closeAdmin(){ const ov=$("adminView"); if(ov) ov.hidden=true; document.body.classList.remove("adm-open"); }
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-adm-open]")){ openAdmin(); return; }
  if(t.closest("[data-adm-close]")){ closeAdmin(); return; }
  if(t.closest("[data-adm-refresh]")){ admLoad(); if(ADM.tab==="activity") loadActivity(); return; }
  const tab=t.closest("[data-adm-tab]"); if(tab){ ADM.tab=tab.dataset.admTab; ADM.arm=null; renderAdmin(); if(ADM.tab==="activity") loadActivity(); return; }
  const arm=t.closest("[data-adm-arm]"); if(arm){ ADM.arm=arm.dataset.admArm; renderAdmin(); setTimeout(()=>{ if(ADM.arm===arm.dataset.admArm){ ADM.arm=null; renderAdmin(); } },4000); return; }
  const un=t.closest("[data-adm-unban]"); if(un){ const {error}=await NH.sb.from("banned").delete().eq("uid",un.dataset.admUnban); toast(error?"Couldn't unban.":"Member unbanned."); admLoad(); return; }
  const bd=t.closest("[data-admbadge]"); if(bd){ const k=bd.dataset.admbadge, uid=bd.dataset.uid, on=!BADGES[uid]?.[k]; try{ await setBadge(uid,k,on); toast(`${k==="vip"?"VIP":"Donor"} badge ${on?"added":"removed"}.`); }catch(err){ toast("Couldn't change the badge."); } return; }
  const go=t.closest("[data-adm-go]"); if(!go) return;
  const [kind,id]=go.dataset.admGo.split(/:(.+)/); ADM.arm=null;
  try{
    if(kind==="ban"){ const {error}=await NH.sb.from("banned").insert({uid:id}); if(error) throw error; toast("Member banned."); }
    else if(kind==="msg"){ await ACC.db.doc("chat/"+id).delete(); toast("Message deleted."); }
    else if(kind==="poll"){ await ACC.db.doc("polls/"+id).delete(); toast("Poll deleted."); }
    else if(kind==="lg"){ const ch=await ACC.db.collection("leagues/"+id+"/chat").get(); for(const d of ch.docs) await ACC.db.doc("leagues/"+id+"/chat/"+d.id).delete(); await ACC.db.doc("leagues/"+id).delete(); toast("League deleted."); }
  }catch(err){ toast("Couldn't do that: "+(err?.message||err)); }
  admLoad();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("adminView")?.hidden) closeAdmin(); });
// Admin button in the account sheet (owner only)
const _openAcctAdm=openAcct;
openAcct=function(){ _openAcctAdm(); if(ACC.id&&ACC.owner){ const out=$("sheet").querySelector("[data-signout]"); const b=`<button class="btn-gold adm-btn" data-adm-open="1">Open admin page</button>`; if(out) out.insertAdjacentHTML("beforebegin",b); else $("sheet").insertAdjacentHTML("beforeend",b); } };
if(location.hash==="#admin") accReady.then(()=>{ if(ACC.owner) openAdmin(); });
// Admin shortcut in the header, next to Update (owner only)
accReady.then(()=>{
  if(!ACC.owner || $("admHdrBtn")) return;
  $("refreshBtn")?.insertAdjacentHTML("beforebegin",`<button class="refresh adm-hdr" id="admHdrBtn" data-adm-open="1" aria-label="Admin page" title="Admin"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></button>`);
});

</script>
