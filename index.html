    </div>
    <div id="newsBody"></div>
  </section>

<div class="learn">
<details${n(e)}><summary>How fantasy football works</summary><div class="ld">
<p>You draft a team of real NFL players. Each week you pick a starting lineup, and your players earn points based on what they do in their real games. You face one other team in your league each week, and whoever scores more wins.</p>
<p>Most leagues have 10 or 12 teams. The regular season usually runs through Week 14 or 15, then the top teams make the playoffs.</p></div></details>
<details><summary>Your lineup</summary><div class="ld">
<table class="ltbl"><tbody>
<tr><td>QB</td><td>1 quarterback${FX.fmt==="SF"?" (plus a Superflex spot that can hold a second QB)":""}</td></tr><tr><td>RB</td><td>2 running backs</td></tr><tr><td>WR</td><td>2 or 3 wide receivers</td></tr>
<tr><td>TE</td><td>1 tight end</td></tr><tr><td>FLEX</td><td>1 extra RB, WR or TE, whoever you think scores more</td></tr>
${FX.fmt==="SF"?"<tr><td>SUPERFLEX</td><td>Any QB, RB, WR or TE. Almost always use a QB here.</td></tr>":""}
<tr><td>K</td><td>1 kicker</td></tr><tr><td>DEF</td><td>1 team defense</td></tr><tr><td>Bench</td><td>Backups. Bench points don't count.</td></tr></tbody></table>
<p>Every league is set up a little differently, so check your league's settings in your app.</p></div></details>
<details${n(e)}><summary>How players score (${SCORELBL[FX.score]})</summary><div class="ld">
<table class="ltbl"><tbody>
${r}
<tr><td>Every 10 rushing or receiving yards</td><td>1 point</td></tr>
<tr><td>Every 25 passing yards</td><td>1 point</td></tr>
<tr><td>Rushing or receiving TD</td><td>6 points</td></tr><tr><td>Passing TD</td><td>4 points (6 in some leagues)</td></tr>
<tr><td>Interception or fumble lost</td><td>\u22122 points (\u22121 in some leagues)</td></tr></tbody></table>
<p>Example: a receiver with 6 catches, 80 yards and a TD scores ${t?`${6*t} + `:""}8 + 6 = <b>${a} points</b>.</p>
<p>Not sure which scoring your league uses? Look for \u201CPPR\u201D, \u201C0.5 PPR\u201D or \u201CStandard\u201D in your league settings, then pick it at the top of this tab.</p></div></details>
<details><summary>Types of leagues</summary><div class="ld"><dl class="lgloss">
<dt>Redraft</dt><dd>The most common. You draft a new team every year.</dd>
<dt>Keeper</dt><dd>You keep a few players from last year's team.</dd>
<dt>Dynasty</dt><dd>You keep your whole roster year to year and draft rookies. Young players matter more.</dd>
<dt>Best ball</dt><dd>No lineups to set. Your highest-scoring players count automatically each week.</dd>
<dt>Superflex / 2QB</dt><dd>You can start two quarterbacks, which makes QBs far more valuable.</dd>
<dt>Points league</dt><dd>Instead of head-to-head matchups, you're ranked by total points all season.</dd></dl></div></details>
<details${n(e)}><summary>Your weekly routine</summary><div class="ld">
<ol class="lsteps">
<li><b>Monday\u2013Tuesday:</b> check the Waivers tab and put in claims for injured starters' backups or hot players.</li>
<li><b>Wednesday\u2013Friday:</b> watch the injury report. Players marked Out won't play.</li>
<li><b>Thursday:</b> set anyone playing Thursday night before kickoff.</li>
<li><b>Sunday morning:</b> check Start/Sit, swap out anyone injured or on bye, and confirm inactives about 90 minutes before kickoff.</li></ol></div></details>
<details><summary>Smart tips</summary><div class="ld">
<ul class="ltips">
<li><b>Volume beats talent.</b> Players who get lots of carries and targets score more consistently than big names with small roles.</li>
<li><b>Never start a player who's on bye or ruled Out.</b> He scores zero.</li>
<li><b>Grab the backup.</b> When a starting running back gets hurt, his backup often becomes a weekly starter.</li>
<li><b>Stream defenses and kickers.</b> Pick them up week to week based on easy matchups instead of holding one all year.</li>
<li><b>Don't overreact to one game.</b> Look at targets, snaps and touches, not just points.</li>
<li><b>Matchups matter most for borderline players.</b> Always start your studs.</li></ul></div></details>
<details${n(!e)}><summary>Advanced strategy</summary><div class="ld">
<ul class="ltips">
<li><b>FAAB bidding.</b> Spend early on breakout players with clear roles, but keep 30\u201340% of your budget for midseason injuries.</li>
<li><b>Buy low, sell high.</b> Trade for good players stuck in a cold streak with steady usage; sell players whose points came from rare long TDs.</li>
<li><b>Look at playoff weeks.</b> By midseason, favor players with easy matchups in Weeks 15\u201317.</li>
<li><b>Handcuff wisely.</b> Hold your own star RB's backup only if he'd take over the whole job. Otherwise, stash other teams' backups with that upside.</li>
<li><b>Use usage stats.</b> Snap share, target share, red-zone touches and routes run predict points better than last week's box score.</li>
<li><b>Late-game swaps.</b> Put flex players from Sunday night or Monday games in your flex spot so you can still swap if news breaks.</li>
<li><b>Weather and Vegas lines.</b> High game totals mean more scoring chances; heavy wind hurts passing games and kickers.</li></ul></div></details>
<details><summary>Fantasy terms</summary><div class="ld"><dl class="lgloss">
<dt>Waiver wire</dt><dd>The pool of players nobody has rostered. You claim them to add them to your team.</dd>
<dt>FAAB</dt><dd>Free Agent Acquisition Budget: a pretend budget you bid on waiver players with. Highest bid wins.</dd>
<dt>Flex</dt><dd>A lineup spot that can hold a RB, WR or TE.</dd>
<dt>Bye week</dt><dd>The one week each team doesn't play. Its players score zero that week.</dd>
<dt>Streaming</dt><dd>Picking up a different player (often QB, DEF or K) each week based on matchups.</dd>
<dt>Handcuff</dt><dd>The backup to your starting running back, held as insurance.</dd>
<dt>Target share</dt><dd>The percent of a team's passes thrown to a player. Higher means more chances.</dd>
<dt>Snap share</dt><dd>The percent of plays a player is on the field.</dd>
<dt>Floor / ceiling</dt><dd>A player's bad-week and great-week outcomes. High floor is safe, high ceiling is boom-or-bust.</dd>
