<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>North Huddle</title>
<meta name="description" content="Unofficial Minnesota football fan hub: news, stats, live scores, fantasy leagues and fan chat.">
<meta name="theme-color" content="#4F2683">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="North Huddle">
<meta property="og:title" content="North Huddle">
<meta property="og:description" content="Live scores, fantasy leagues, game picks and fan chat. An unofficial Minnesota football fan hub.">
<meta property="og:image" content="https://north-huddle.pages.dev/og.png">
<meta property="og:url" content="https://north-huddle.pages.dev/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://north-huddle.pages.dev/og.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="North Huddle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling view, fixed bottom tab bar (stadium scoreboard type, purple and gold). */
:root{
  --bg:#F5F2FA; --surface:#FFFFFF; --surface-2:#EDE7F6; --line:#DDD3EC;
  --fg:#1B1324; --muted:#6B5F7C; --purple:var(--tpri,#4F2683); --purple-ink:var(--tink-l,#4F2683);
  --gold:var(--tacc,#FFC62F); --on-gold:var(--tonacc,#2A1A00); --hi:var(--thi,#FFC62F); --win:#1F7A4D; --loss:#B3261E; --warn:#A15C00;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --turf:#2F6B3A; --turf-line:rgba(255,255,255,.28); --turf-text:#FFFFFF; --turf-pill:rgba(14,30,18,.62); --pants:#EFE9DA; --pants-edge:#B8AE96; --shoe:#17121F; --hurt:#E5322B;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110C18; --surface:#1C1527; --surface-2:#271E36; --line:#352a47;
  --fg:#EFEAF6; --muted:#A898BC; --purple:var(--tpri-d,#5B2E99); --purple-ink:var(--tink-d,#B79AE6);
  --gold:var(--tacc,#FFC62F); --on-gold:var(--tonacc,#2A1A00); --win:#4CC38A; --loss:#FF7A70; --warn:#F2B04C; --turf:#1F4A28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110C18; --surface:#1C1527; --surface-2:#271E36; --line:#352a47;
  --fg:#EFEAF6; --muted:#A898BC; --purple:var(--tpri-d,#5B2E99); --purple-ink:var(--tink-d,#B79AE6);
  --gold:var(--tacc,#FFC62F); --on-gold:var(--tonacc,#2A1A00); --win:#4CC38A; --loss:#FF7A70; --warn:#F2B04C; --turf:#1F4A28; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--purple-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--purple);color:#fff;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand{background:none;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 0;text-align:left;font-size:clamp(18px,5.6vw,22px)}
.brand .hubw{color:var(--hi)}
.chev-d{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85;flex:none}
.trow.cur{background:var(--surface-2)}
.sheet>*{flex-shrink:0}
.updated{font-size:12px;opacity:.85;text-align:right}
.updated b{display:block;font-weight:600;opacity:1}

main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 100px}
section.view{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

/* hero scoreboard */
.hero{background:var(--purple);color:#fff;border-radius:var(--r);padding:18px 18px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:end;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -20px -36px auto;width:140px;height:140px;border:14px solid color-mix(in srgb,var(--gold) 18%,transparent);border-radius:50%}
.record{font-family:var(--display);font-weight:800;font-size:64px;line-height:.85;color:var(--hi)}
.hero .meta{font-size:13px;opacity:.9;display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.hero .meta strong{font-family:var(--display);font-size:20px;letter-spacing:.03em;opacity:1}
.hero .pills{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;position:relative;z-index:1}
.pill{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.14)}

.alert{background:var(--gold);color:var(--on-gold);border-radius:var(--r);padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.alert small{display:block;font-weight:500;opacity:.8}

.game-card{display:flex;flex-direction:column;gap:10px}
.gc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opp{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05}
.sub{color:var(--muted);font-size:13px}
.countdown{display:flex;gap:8px}
.cd{background:var(--surface-2);border-radius:8px;padding:6px 10px;text-align:center;min-width:56px}
.cd b{display:block;font-family:var(--display);font-size:24px;line-height:1}
.cd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.score{font-family:var(--display);font-weight:700;font-size:30px;display:flex;align-items:center;gap:10px}

.chip{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:2px 8px;border-radius:6px;display:inline-block;line-height:1.5}
.chip.w{background:var(--win);color:#fff}.chip.l{background:var(--loss);color:#fff}.chip.t{background:var(--muted);color:#fff}
.chip.bye{background:var(--surface-2);color:var(--muted)}.chip.up{background:var(--surface-2);color:var(--purple-ink)}
.chip.live{background:var(--loss);color:#fff;animation:pulse 1.4s infinite}
.chip.new{background:var(--gold);color:var(--on-gold)}
.chip.pos{background:var(--surface-2);color:var(--purple-ink)}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.chip.live{animation:none}}

.leaders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.leaders{grid-template-columns:repeat(3,minmax(0,1fr))}}
.leader{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.leader:hover{border-color:var(--purple-ink)}
.leader .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--purple-ink)}
.leader .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
button.row{cursor:pointer}button.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted)}
.wk{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);width:30px;flex:none;text-align:center}
.rscore{font-family:var(--display);font-weight:700;font-size:18px;text-align:right;flex:none}
.inj-status{font-size:13px;font-weight:600;color:var(--warn);text-align:right;flex:none;max-width:40%}
.inj-status.out{color:var(--loss)}

.controls{display:flex;flex-direction:column;gap:10px}
input[type=search]{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--purple-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.statline{font-size:13px;color:var(--muted)}
.keystat{font-family:var(--display);font-weight:700;font-size:20px;text-align:right;flex:none;line-height:1.1}
.keystat small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted)}

.news-item{display:flex;flex-direction:column;gap:4px;padding:14px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.news-item:first-child{border-top:0}
a.news-item:hover{background:var(--surface-2)}
.news-item .h{font-weight:600;font-size:16px;line-height:1.3;text-wrap:balance}
.news-item .s{color:var(--muted);font-size:14px}
.news-item .m{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;border-top:0}
th:first-child,td:first-child{text-align:left}
tr.us td{background:var(--surface-2);font-weight:600}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;max-width:720px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);position:relative;font-size:11px;font-weight:600;letter-spacing:.03em}
nav.tabs button[aria-current=page]{color:var(--purple-ink)}
nav.tabs button::before{content:"";position:absolute;top:4px;left:50%;width:52px;height:26px;transform:translateX(-50%);border-radius:999px;background:transparent;transition:background-color .2s ease,box-shadow .2s ease;z-index:0}
nav.tabs svg{position:relative;z-index:1;transition:color .2s ease}
nav.tabs .badge{z-index:2}
nav.tabs button[aria-current=page]::before{background:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 90%,transparent),0 0 10px 2px color-mix(in srgb,var(--gold) 65%,transparent),0 0 22px 4px color-mix(in srgb,var(--gold) 30%,transparent)}
nav.tabs button[aria-current=page] svg{color:var(--on-gold)}
nav.tabs button:not([aria-current=page]):hover::before{background:var(--surface-2)}
@media (prefers-reduced-motion:reduce){nav.tabs button::before,nav.tabs svg{transition:none}}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--gold);color:var(--on-gold);font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px}

.sheet-bg{position:fixed;inset:0;background:rgba(10,5,18,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head .nm{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.x{border:0;background:var(--surface-2);border-radius:999px;width:36px;height:36px;font-size:20px;cursor:pointer;flex:none}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.sg b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.sg span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* refresh */
.hdr-right{display:flex;align-items:center;gap:10px}
.refresh{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 12px 6px 9px;
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
.refresh svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.refresh[disabled]{opacity:.6;cursor:default}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.refresh.spin svg{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.25)}

/* team badges (team colors + abbreviation) */
.tb{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.02em;border:3px solid;line-height:1}
.tb.lg{width:46px;height:46px;font-size:15px;border-width:4px}
.matchup{display:flex;align-items:center;gap:12px}

/* depth chart + field */
.field-wrap{background:var(--turf);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.field-wrap svg{display:block;width:100%;height:auto}
.fld-line{stroke:var(--turf-line);stroke-width:1}
.fld-los{stroke:var(--gold);stroke-width:2;stroke-dasharray:6 4}
.fld-num{fill:var(--turf-line);font-family:var(--display);font-weight:700;font-size:18px}
.pl .fig *{stroke-linejoin:round}
.pl .jer,.pl .helm,.pl .sleeve{fill:var(--purple);stroke:var(--gold);stroke-width:1.2}
.pl .pant{fill:var(--pants);stroke:var(--pants-edge);stroke-width:.8}
.pl .kneepad{fill:var(--pants);stroke:var(--pants-edge);stroke-width:.6}
.pl .sock{fill:var(--purple);stroke:var(--gold);stroke-width:.8}
.pl .shoe{fill:var(--shoe)}
.pl .glove{fill:var(--pants);stroke:var(--pants-edge);stroke-width:.6}
.pl .stripe{fill:var(--gold)}
.pl .mask{fill:none;stroke:#E4DEEE;stroke-width:1.2;stroke-linecap:round}
.pl .injured{fill:var(--hurt);stroke:#FFFFFF;stroke-width:1.1;filter:drop-shadow(0 0 1.6px var(--hurt)) drop-shadow(0 0 1.6px var(--hurt))}
.pl .injured-stripe{fill:#FFFFFF}
.pl.hurt-unknown .jer,.pl.hurt-unknown .helm{stroke:var(--hurt);stroke-width:2}
.pl .itag rect{fill:var(--hurt);stroke:#FFFFFF;stroke-width:.9}
.pl .itag text{fill:#FFFFFF;font-family:var(--display);font-weight:800;font-size:7.5px;letter-spacing:.03em;text-anchor:middle;dominant-baseline:central}
.stack{display:flex;flex-direction:column;gap:12px}
.tsearch{display:flex;flex-direction:column;gap:8px}
#tresults{max-height:420px;overflow-y:auto}
.tb-sm .tb{width:30px;height:30px;font-size:10.5px;border-width:2.5px}
.tbtn{border:1.5px solid var(--purple-ink);color:var(--purple-ink);background:none;border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;flex:none}
.tbtn:hover{background:var(--surface-2)}
.tbtn.on{border-color:var(--line);color:var(--muted);cursor:default;background:none}
.st-note{color:var(--warn);font-weight:600}
.pending{color:var(--muted);font-style:italic}
.chev{color:var(--muted);font-size:22px;flex:none;line-height:1}
.danger{border:1.5px solid var(--loss);color:var(--loss);background:none;border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
.danger.armed{background:var(--loss);color:#fff}
.fhero{background:var(--purple);color:#fff;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.fhero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fh-label{color:rgba(255,255,255,.75)}
.fh-title{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;margin-top:2px}
.fh-score{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;background:var(--gold);color:var(--on-gold);border-radius:6px;padding:3px 8px;flex:none}
.fh-byes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fh-badges{display:flex;gap:6px}
.fh-badges .tb{width:30px;height:30px;font-size:10.5px;border-width:2.5px}
.fh-sum{margin:0;font-size:14px;opacity:.95}
.fh-lock{margin:0;font-size:13px;color:var(--hi);font-weight:600}
.fsegs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fsegs::-webkit-scrollbar{display:none}
.fsegs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em;cursor:pointer}
.fsegs button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 12px;font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer}
.fchip[aria-pressed=true]{background:var(--surface-2);color:var(--purple-ink);border-color:var(--purple-ink)}
.frow{align-items:flex-start}
.frow .tb-sm{margin-top:2px}
.freason{font-size:13.5px;color:var(--fg);opacity:.85;margin-top:4px;line-height:1.4}
.fcall{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;border-radius:6px;padding:3px 9px;flex:none;margin-top:2px}
.fc-start{background:var(--win);color:#fff}.fc-sit{background:var(--loss);color:#fff}.fc-flex{background:var(--gold);color:var(--on-gold)}
.fsub{margin:-4px 0 0;color:var(--muted);font-size:13.5px}
.fsetup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fs-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fs-lbl{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:64px;flex:none}
.fs-opts{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.fs-opts button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:4px 10px;font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer}
.fs-opts button[aria-pressed=true]{background:var(--surface-2);color:var(--purple-ink);border-color:var(--purple-ink)}
.fadj{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.fadj b{color:var(--purple-ink)}
.rk{font-family:var(--display);font-weight:800;font-size:18px;width:24px;text-align:center;color:var(--purple-ink);flex:none}

<script>
/* ===================== North Huddle data layer =====================
   Gives the page the same small db/user API it was written against,
   backed by Supabase (one "docs" table: path -> JSON data). */
(function(){
  const SB_URL="https://hoxcsdtbljhfappkshya.supabase.co";
  const SB_KEY="sb_publishable_KON7uG5HO_MW7fi2JVo9aw_-mpduqIe";
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  window.SB=sb;
  const segs=p=>String(p).split("/").filter(Boolean);
  const parentOf=p=>segs(p).slice(0,-1).join("/");
  const lastOf=p=>segs(p).slice(-1)[0];
  const rid=()=>{ const A="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(20)); r.forEach(x=>s+=A[x%62]); return s; };
  const err=(code,message)=>Object.assign(new Error(message||code),{code});
  const mapErr=e=>{ const m=String(e?.message||e||""); if(/not_found/.test(m)) return err("invalid_argument","Document does not exist"); if(/row-level security|permission|42501/i.test(m)) return err("permission_denied",m); return err("unavailable",m); };

  function docSnap(row,path){ const d=row?row.data:undefined; return {id:row?row.id:lastOf(path), exists:!!row, ref:null, data:()=>d===undefined?undefined:JSON.parse(JSON.stringify(d))}; }
  function querySnap(rows){ const docs=rows.map(r=>docSnap(r,r.path)); return {docs, size:docs.length, empty:!docs.length, forEach:f=>docs.forEach(f)}; }

  /* ---------- live listeners ---------- */
  const listeners=new Set();
  function notify(path){
    const col=parentOf(path);
    listeners.forEach(l=>{ if(l.kind==="doc"? l.path===path : l.col===col) l.kick(); });
  }
  let live=false;
  sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const path=(p.new&&p.new.path)||(p.old&&p.old.path);
    if(path) notify(path); else listeners.forEach(l=>l.kick());
  }).subscribe(st=>{ const was=live; live=(st==="SUBSCRIBED"); if(live&&!was) listeners.forEach(l=>l.kick()); });
  // Safety net if live updates drop: refresh when the tab comes back, and slowly while visible.
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) listeners.forEach(l=>l.kick()); });
  setInterval(()=>{ if(!document.hidden) listeners.forEach(l=>l.kick()); }, 120000);
  function listen(kind,key,fetcher,onNext,onErr){
    let last=null, t=0, stopped=false, busy=false, again=false;
    const run=async()=>{
      if(stopped) return; if(busy){ again=true; return; } busy=true;
      try{ const snap=await fetcher(); const sig=JSON.stringify(snap.raw); if(sig!==last){ last=sig; onNext(snap.out); } }
      catch(e){ if(onErr) onErr(mapErr(e)); }
      busy=false; if(again){ again=false; run(); }
    };
    const l={kind, path:kind==="doc"?key:null, col:kind==="col"?key:null, kick(){ clearTimeout(t); t=setTimeout(run,250); }};
    listeners.add(l); run();
    return ()=>{ stopped=true; listeners.delete(l); };
  }

  /* ---------- documents ---------- */
  async function getRow(path){ const {data,error}=await sb.from("docs").select("path,id,data").eq("path",path).maybeSingle(); if(error) throw error; return data; }
  function docRef(path){
    path=segs(path).join("/");
    const ref={
      id:lastOf(path), path,
      async get(){ try{ return docSnap(await getRow(path),path); }catch(e){ throw mapErr(e); } },
      async set(data){ const {error}=await sb.from("docs").upsert({path, col:parentOf(path), id:lastOf(path), data, updated_at:new Date().toISOString()}); if(error) throw mapErr(error); notify(path); },
      async update(data){ const {error}=await sb.rpc("doc_update",{p_path:path, p_patch:data}); if(error) throw mapErr(error); notify(path); },
      async delete(){ const {error}=await sb.from("docs").delete().eq("path",path); if(error) throw mapErr(error); notify(path); },
      async acquire(o){ o=o||{}; const {data,error}=await sb.rpc("doc_acquire",{p_path:path, p_holder:String(o.holder||rid()), p_ttl_ms:Number(o.ttlMs||1000)}); if(error) throw mapErr(error); return {acquired:!!data, holder:o.holder}; },
      collection(c){ return colRef(path+"/"+c); },
      onSnapshot(next,onErr){ return listen("doc",path,async()=>{ const r=await getRow(path); return {raw:r, out:docSnap(r,path)}; },next,onErr); }
    };
    return ref;
  }
  function colRef(col,q){
    col=segs(col).join("/"); q=q||{wh:[],ord:null,lim:null};
    const build=()=>{
      let qb=sb.from("docs").select("path,id,data").eq("col",col);
      q.wh.forEach(([f,op,v])=>{
        if(op==="array-contains") qb=qb.contains("data",{[f]:[v]});
        else if(op==="=="||op==="===") qb=qb.contains("data",{[f]:v});
        else if(op==="!=") qb=qb.not("data->>"+f,"eq",String(v));
        else if(op===">"||op===">="||op==="<"||op==="<="){ const m={">":"gt",">=":"gte","<":"lt","<=":"lte"}[op]; qb=qb.filter("data->>"+f,m,String(v)); }
      });
      if(q.ord) qb=qb.order("data->"+q.ord[0],{ascending:q.ord[1]!=="desc",nullsFirst:false}); else qb=qb.order("id",{ascending:true});
      qb=qb.limit(q.lim||1000);
      return qb;
    };
    const fetchRows=async()=>{ const {data,error}=await build(); if(error) throw error; return data||[]; };
    return {
      id:lastOf(col), path:col,
      doc(id){ return docRef(col+"/"+(id||rid())); },
      where(f,op,v){ return colRef(col,{...q,wh:[...q.wh,[f,op,v]]}); },
      orderBy(f,dir){ return colRef(col,{...q,ord:[f,dir||"asc"]}); },
      limit(n){ return colRef(col,{...q,lim:n}); },
      async get(){ try{ return querySnap(await fetchRows()); }catch(e){ throw mapErr(e); } },
      async add(data){ const r=docRef(col+"/"+rid()); await r.set(data); return r; },
      onSnapshot(next,onErr){ return listen("col",col,async()=>{ const rows=await fetchRows(); return {raw:rows, out:querySnap(rows)}; },next,onErr); }
    };
  }
  const db=Object.freeze({doc:docRef, collection:colRef});

  /* ---------- who is viewing ---------- */
  const sessionP=sb.auth.getSession().then(r=>r.data.session).catch(()=>null);
  let adminP=null;
  const profCache={};
  async function profiles(ids){
    ids=[...new Set((ids||[]).filter(Boolean))]; const need=ids.filter(i=>!profCache[i]);
    if(need.length){ try{ const {data}=await sb.from("docs").select("id,data").eq("col","profiles").in("id",need); (data||[]).forEach(r=>profCache[r.id]={name:r.data?.name||"", avatarUrl:r.data?.photo||""}); }catch(e){} need.forEach(i=>{ if(!profCache[i]) profCache[i]={name:"",avatarUrl:""}; }); }
    const out={}; ids.forEach(i=>out[i]={id:i,...profCache[i]}); return out;
  }
  async function makeUser(){
    const s=await sessionP; if(!s) return null;
    const u=s.user;
    return Object.freeze({
      async id(){ return u.id; },
      async me(){ const p=(await profiles([u.id]))[u.id]; return {id:u.id, name:p.name||u.user_metadata?.name||(u.email||"").split("@")[0], avatarUrl:p.avatarUrl||"", email:u.email}; },
      profiles,
      async isOwner(){ adminP=adminP||sb.rpc("is_admin").then(r=>!!r.data).catch(()=>false); return adminP; },
      async canEdit(){ return this.isOwner(); },
      async can(){ return true; },
      async search(qs){ const {data}=await sb.from("docs").select("id,data").eq("col","profiles").ilike("data->>name","%"+String(qs||"")+"%").limit(20); return (data||[]).map(r=>({id:r.id,name:r.data?.name||""})); }
    });
  }
  const userP=makeUser();
  window.claude={ use(name){ if(name==="db") return Promise.resolve(db); if(name==="user") return userP; return Promise.resolve(null); } };

  /* ---------- sign in / sign up ---------- */
  window.NH={
    sb, session:sessionP,
    async signIn(email,password){ const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error; location.reload(); },
    async signUp(name,email,password){
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}}); if(error) throw error;
      if(!data.session) return "confirm";
      try{ await docRef("profiles/"+data.user.id).set({name, photo:"", updatedAt:new Date().toISOString()}); }catch(e){}
      location.reload(); return "ok";
    },
    async signOut(){ await sb.auth.signOut(); location.reload(); },
    async resetPassword(email){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/"}); if(error) throw error; },
    async setPassword(pw){ const {error}=await sb.auth.updateUser({password:pw}); if(error) throw error; }
  };
})();

</script>

const norm = s => String(s||"").toLowerCase().replace(/\b(jr|sr|ii|iii)\b\.?/g,"").replace(/[^a-z]/g,"");
function findPlayer(name){ const n=norm(name); return S.players.find(p=>norm(p.name)===n); }
function findInjury(name){ const n=norm(name); return S.injuries.find(i=>norm(i.player)===n); }
const TZ = "America/Chicago";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtDate(iso, opts){ if(!iso) return "TBD"; const d=new Date(iso); return d.toLocaleString("en-US",{timeZone:TZ,...opts}); }
function gameWhen(g){
  if(!g.kickoff && g.date) return new Date(g.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})+" · Time TBD";
  return fmtDate(g.kickoff,{weekday:"short",month:"short",day:"numeric"})+" · "+fmtDate(g.kickoff,{hour:"numeric",minute:"2-digit"})+" CT";
}
function ago(iso){
  if(!iso) return ""; const s=(Date.now()-new Date(iso))/1000;
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago";
  const d=Math.floor(s/86400); return d===1?"yesterday":d+"d ago";
}
function gameTime(g){ return new Date(g.kickoff || (g.date ? g.date+"T12:00:00" : 0)).getTime(); }
function resultChip(g){
  if(g.status==="bye") return '<span class="chip bye">BYE</span>';
  if(g.status==="live") return '<span class="chip live">LIVE</span>';
  if(g.status==="final"){ const r=(g.result||"").toLowerCase(); return `<span class="chip ${r}">${esc(g.result)}</span>`; }
  return '<span class="chip up">UP NEXT</span>';
}
function oppLine(g){ return (g.home?"vs ":"@ ")+esc(g.opp); }

/* ---------- views ---------- */
function renderHeader(){
  const m=S.meta; if(!m){ if(CUR!=="MIN") $("updated").innerHTML=loadingTeam[CUR]?"<b>Loading…</b>About 5 minutes":"<b>Not loaded yet</b>"+esc(TEAMS[CUR][0]); return; }
  $("updated").innerHTML = `<b>Updated ${esc(ago(m.updatedAt))}</b>${esc(fmtDate(m.updatedAt,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))} CT`;
}

function leaderCards(){
  const P=S.players, top=(f)=>P.filter(p=>f(p)!=null).sort((a,b)=>f(b)-f(a))[0];
  const defs=[
    ["Passing yds", p=>p.stats?.pass?.yds],
    ["Rushing yds", p=>p.stats?.rush?.yds],
    ["Receiving yds", p=>p.stats?.rec?.yds],
    ["Receptions", p=>p.stats?.rec?.rec],
    ["Sacks", p=>p.stats?.def?.sacks],
    ["Interceptions", p=>p.stats?.def?.int],
  ];
  return defs.map(([label,f])=>{ const p=top(f); if(!p) return ""; return `<button class="leader" data-player="${esc(p.id)}"><span class="label">${label}</span><span class="big num">${esc(f(p))}</span><span class="who">${esc(p.name)}</span></button>`;}).join("");
}

function renderHome(){
  const el=$("v-home"), m=S.meta;
  if(!m){ el.innerHTML = `<div class="card empty">${S.dbMissing && CUR==="MIN" ? "Live data couldn't load. Check your connection and refresh." : (CUR==="MIN"?"Loading the latest Vikings data…":(loadingTeam[CUR]?`Building the ${esc(NICK())} hub. It fills in automatically in about 5 minutes.`:(DB?`Getting the ${esc(NICK())} hub ready…`:`The ${esc(NICK())} hub hasn’t been loaded yet. Check back soon.`)))}</div>`; return; }
  const now=Date.now();
  const played=S.games.filter(g=>g.status==="final").sort((a,b)=>gameTime(b)-gameTime(a));
  const live=S.games.find(g=>g.status==="live");
  const next=S.games.filter(g=>g.status==="scheduled" && gameTime(g)>now-4*3600e3).sort((a,b)=>gameTime(a)-gameTime(b))[0];
  const last=played[0];
  let h=`<div class="hero">
    <div class="record num">${esc(m.record||"0-0")}</div>
    <div class="meta"><strong>${esc(m.divisionRank||"")}</strong><span>${esc(m.season||"")} regular season</span></div>
    <div class="pills">
      ${m.streak?`<span class="pill">Streak ${esc(m.streak)}</span>`:""}
      ${m.recordHome?`<span class="pill">Home ${esc(m.recordHome)}</span>`:""}
      ${m.recordAway?`<span class="pill">Away ${esc(m.recordAway)}</span>`:""}
      ${m.pf!=null?`<span class="pill num">PF ${esc(m.pf)} · PA ${esc(m.pa)}</span>`:""}
    </div></div>`;
  if(m.alert) h+=`<div class="alert"><div>${esc(m.alert)}<small>${esc(ago(m.alertAt||m.updatedAt))}</small></div></div>`;
  if(live) h+=`<div class="card game-card"><div class="gc-head"><span class="label">Week ${esc(live.week)} · In progress</span>${resultChip(live)}</div>
      <div class="score num">${badge(CUR)} ${esc(live.us??0)} <span class="sub">–</span> ${esc(live.them??0)} ${badge(live.oppAbbr)}</div><div class="sub">${esc(live.note||"")}</div></div>`;
  if(next) h+=`<div class="card game-card"><div class="gc-head"><span class="label">Next game · Week ${esc(next.week)}</span>${resultChip(next)}</div>
      <div class="matchup">${badge(next.oppAbbr,true)}<div class="opp">${oppLine(next)}</div></div>
      <div class="sub">${esc(gameWhen(next))}<br>${esc(next.venue||"")}${next.tv?" · "+esc(next.tv):""}</div>
      <div class="countdown" id="countdown" data-t="${gameTime(next)}"></div></div>`;
  if(last) h+=`<div class="card game-card"><div class="gc-head"><span class="label">Last game · Week ${esc(last.week)}</span>${resultChip(last)}</div>
      <div class="score num">${badge(CUR)} ${esc(last.us)} <span class="sub">–</span> ${esc(last.them)} ${badge(last.oppAbbr)}</div>
      <div class="sub">${oppLine(last)} · ${esc(gameWhen(last).split(" · ")[0])}</div>${last.note?`<div class="statline">${esc(last.note)}</div>`:""}</div>`;

function tickCountdown(){
  const c=document.getElementById("countdown"); if(!c) return;

/* Which body parts an injury touches. Front view: the player's left side is drawn on the viewer's right (+x). */
function injuryParts(inj){

  const t=String(inj.injury||"").toLowerCase()+" ";

  if(/elbow|\barm\b|bicep|tricep|forearm/.test(t)) both("arm");
  if(/hand|thumb|finger|wrist/.test(t)) both("hand");
  if(/hamstring|quad|thigh|hip|groin/.test(t)) both("thigh");
  if(/knee|acl|mcl|pcl|menisc|patella/.test(t)) both("knee");
  if(/ankle|foot|feet|toe|achilles|calf|shin|heel/.test(t)) both("shin");
  if(/\bleg\b/.test(t)){ both("thigh"); both("knee"); both("shin"); }

/* short injury-status tag shown above the helmet */
const TAGH=12;
const TAG_NAMES={IR:"injured reserve",PUP:"physically unable to perform",O:"out",D:"doubtful",Q:"questionable",CP:"concussion protocol",DTD:"day-to-day",INJ:"injured"};
function injuryTag(inj){
  if(!inj) return "";
  const t=String(inj.status||"").toLowerCase();
  if(/reserve|\bir\b/.test(t)) return "IR";
  if(/\bpup\b|physically unable/.test(t)) return "PUP";
  if(/\bout\b/.test(t)) return "O";
  if(/doubt/.test(t)) return "D";
  if(/question/.test(t)) return "Q";
  if(/protocol|concuss/.test(t)) return "CP";
  if(/probable|day.to.day|limited|played|through|active/.test(t)) return "DTD";
  return "INJ";
}
function tagSvg(tag){

}
let _mc=null;
function labelW(t){ try{ _mc=_mc||document.createElement("canvas").getContext("2d"); _mc.font=LFONT; return _mc.measureText(t).width+LPAD*2; }catch(e){ return t.length*5.2+LPAD*2; } }
/* place each name pill where it touches no player and no other name */
function placeLabels(spots,H){
  const hit=(a,b)=>a[0]<b[2]&&a[2]>b[0]&&a[1]<b[3]&&a[3]>b[1];
  const boxes=spots.map(s=>[s.x-FW-2,s.y-FH-2-(s.tag?TAGH:0),s.x+FW+2,s.y+FH+2]);
  const clampX=(cx,w)=>Math.min(Math.max(cx,w/2+2),360-w/2-2);
  return spots.map(s=>{
    const w=labelW(s.label), off=FH+LFH/2+3;
    const up=s.tag?TAGH:0;
    const cand={b:[s.x,s.y+off], a:[s.x,s.y-off-up], b2:[s.x,s.y+off+LFH+2], a2:[s.x,s.y-off-up-LFH-2],
      r:[s.x+FW+4+w/2,s.y], l:[s.x-FW-4-w/2,s.y]};
    const order = s.pref==="a" ? ["a","b","r","l","a2","b2"] : ["b","a","r","l","b2","a2"];
    let pick=null;
    for(const k of order){
      const cy=cand[k][1], cx=clampX(cand[k][0],w);
      const box=[cx-w/2,cy-LFH/2,cx+w/2,cy+LFH/2];
      if(box[1]<2||box[3]>H-2) continue;
      if(!boxes.some(b=>hit(b,box))){ pick={cx,cy,w,box}; break; }
    }
    if(!pick){ const cy=cand[order[0]][1], cx=clampX(cand[order[0]][0],w); pick={cx,cy,w,box:[cx-w/2,cy-LFH/2,cx+w/2,cy+LFH/2]}; }
    boxes.push(pick.box);
    return pick;
  });
}
const CIRCLE={LDT:"DT",RDT:"DT",SLB:"LB",LWR:"WR",RWR:"WR",SWR:"WR",LOLB:"OLB",ROLB:"OLB",LDE:"DE",RDE:"DE",LCB:"CB",RCB:"CB",WLB:"LB",MLB:"LB"};
function fieldSvg(unit){

  const H=f.h;

    const jn=byPos[pos]?.numbers?.[0]; const pl=CIRCLE[pos]||pos, hasN=(jn===0||jn); spots.push({pos,x,y,pref,name,num:hasN?String(jn):"",plab:hasN?pl:"",label:(hasN?pl+" ":"")+LASTNAME(name),tag:injuryTag(findInjury(name))});

    names+=`<g ${attrs} aria-hidden="true"><rect class="nm-bg" x="${(L.cx-L.w/2).toFixed(1)}" y="${(L.cy-LFH/2).toFixed(1)}" width="${L.w.toFixed(1)}" height="${LFH}" rx="${LFH/2}"/><text class="nm" x="${L.cx.toFixed(1)}" y="${L.cy.toFixed(1)}">${s.plab?`<tspan class="nm-pos">${esc(s.plab)}</tspan> ${esc(s.label.slice(s.plab.length+1))}`:esc(s.label)}</text></g>`;

let DB=null, NFLIDX=[], fetchT=0, removeArm="";
const norm2=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const STLABEL={RES:"IR",RSR:"IR",RSN:"NFI",NON:"NFI",PUP:"PUP",DEV:"Practice squad",SUS:"Suspended",EXE:"Exempt"};
function buildIdx(){
  NFLIDX=[];
  S.nfl.forEach(t=>(t.players||[]).forEach(([id,name,pos,st])=>NFLIDX.push({id,name,pos,st,abbr:t.abbr,team:t.team,key:norm2(name),hay:" "+norm2(name)+" "+t.abbr.toLowerCase()+" "+String(pos).toLowerCase()+" "})));
}
function searchPlayers(q){
  const words=norm2(q).split(" ").filter(Boolean);
  if(!words.length) return [];
  const hits=NFLIDX.filter(p=>words.every(w=>p.hay.includes(" "+w)||p.key.includes(w)));
  const score=p=>(p.key.startsWith(words[0])?0:(" "+p.key).includes(" "+words[0])?1:2)+(p.st==="ACT"?0:0.5);
  return hits.sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name)).slice(0,15);
}
const isTracked=id=>S.tracked.some(t=>t.id===id);
const statsFor=id=>S.pstats.find(s=>s.id===id);
function renderTrackResults(){
  const box=$("tresults"), q=$("tsearch").value;
  if(!q.trim()){ box.hidden=true; box.innerHTML=""; return; }
  box.hidden=false;
  if(!NFLIDX.length){ box.innerHTML=`<div class="empty">The player list is still loading.</div>`; return; }
  const r=searchPlayers(q);
  box.innerHTML = r.length ? r.map(p=>{
    const on=isTracked(p.id), st=STLABEL[p.st];
    return `<div class="row"><span class="tb-sm">${badge(p.abbr)}</span><div class="grow"><div class="t1">${esc(p.name)}</div><div class="t2">${esc(p.pos)} · ${esc(p.team)}${st?` · <span class="st-note">${esc(st)}</span>`:""}</div></div>
      <button class="tbtn${on?" on":""}" data-track="${esc(p.id)}" ${on?"disabled":""}>${on?"Tracking":"+ Track"}</button></div>`;
  }).join("") : `<div class="empty">No NFL player matches “${esc(q)}”. Try a last name.</div>`;
}
function renderTracker(){
  document.querySelector(".tsearch").hidden=!!S.dbMissing;
  renderTrackResults();
  const list=[...S.tracked].sort((a,b)=>String(a.addedAt).localeCompare(String(b.addedAt)));
  $("tcount").textContent = list.length ? `(${list.length})` : "";
  $("tlist").innerHTML = list.length ? list.map(t=>{
    const s=statsFor(t.id);
    const sub = s?.headline ? esc(s.headline) : `<span class="pending">Getting stats and news…</span>`;
    const tag = s?.status ? `<span class="chip l">${esc(s.status)}</span>` : "";
    return `<button class="row" data-tracked="${esc(t.id)}"><span class="tb-sm">${badge(t.abbr)}</span><div class="grow"><div class="t1">${esc(t.name)} <span class="chip pos">${esc(t.pos)}</span> ${tag}</div><div class="statline">${sub}</div></div><span class="chev" aria-hidden="true">›</span></button>`;
  }).join("") : (S.dbMissing?`<div class="empty">No players tracked yet.</div>`:`<div class="empty">No players tracked yet.<br>Search for anyone in the NFL above and tap <b>+ Track</b>. Their stats and news show up here.</div>`);
}
async function trackPlayer(id){
  const p=NFLIDX.find(x=>x.id===id); if(!p) return;
  if(!DB){ toast("Tracking is managed by the site owner."); return; }
  try{
    await DB.collection("tracked").doc(id).set({name:p.name,abbr:p.abbr,team:p.team,pos:p.pos,addedAt:new Date().toISOString()});
    toast(`Tracking ${p.name}. Stats and news arrive in a few minutes.`,6000);
    queueFetch();
  }catch(e){ toast(`Couldn't add ${p.name}. Only the hub's owner can track players.`,6000); }
}
async function untrack(id){
  if(!DB) return;
  try{ await DB.collection("tracked").doc(id).delete(); closeSheet(); toast("Stopped tracking."); }
  catch(e){ toast("Couldn't remove that player. Try again."); }
}
function queueFetch(){
  clearTimeout(fetchT);
  fetchT=setTimeout(async()=>{
    const missing=S.tracked.filter(t=>!statsFor(t.id));
    if(!missing.length) return;
    try{
      mcpP=mcpP||claude.use("mcp"); const mcp=await mcpP; if(!mcp) return;
      await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:REFRESH_TASK,
        text:"TRACKER-ONLY RUN: the user just started tracking these players. Do only step T (tracked players) for them now, then set hub/meta.updatedAt. Skip the rest of the refresh. Players: "+missing.map(m=>`${m.name} (${m.team}, ${m.pos}) id=${m.id}`).join("; ")},{cache:false});
    }catch(e){ toast("Stats will arrive with the next scheduled update.",6000); }
  },8000);
}

    ${groups || `<div class="card empty">${statsFor(id)?"No stats recorded yet this season.":"Stats and news are on the way. They usually show up within a few minutes of tracking a player."}</div>`}
    ${news.length?`<h2>News</h2><div class="list">${news.map(newsItem).join("")}</div>`:""}

function scoringAdjust(dataScore){
  const base=(dataScore||"PPR").toUpperCase().includes("HALF")?"Half":(dataScore||"PPR").toUpperCase().includes("STANDARD")?"Standard":"PPR";
  const notes=[];
  if(FX.score!==base){
    if(FX.score==="Standard") notes.push(`<b>Standard scoring:</b> catches are worth nothing, so move up workhorse and goal-line running backs and big-play receivers. Move down pass-catching backs, slot receivers and tight ends who live on short catches.`);
    else if(FX.score==="Half") notes.push(`<b>Half-PPR:</b> these calls mostly hold. For close calls, lean toward the player more likely to score a touchdown or get lots of carries.`);
    else notes.push(`<b>PPR:</b> catches count a full point, so lean toward players who get lots of targets, including pass-catching backs and slot receivers.`);
  }
  if(FX.fmt==="SF" && (FX.sec==="rankings"||FX.sec==="startsit"||FX.sec==="waivers")) notes.push(`<b>Superflex / 2QB:</b> quarterbacks are the most valuable players. Start two whenever you can, even a mid-tier QB over most flex options, and grab any starting QB on waivers.`);
  return notes.length?`<div class="fadj">${notes.join("<br>")}</div>`:"";
}

<dt>Streaming</dt><dd>Picking up a different player (often QB, DEF or K) each week based on matchups.</dd>

<dt>Sleeper</dt><dd>A lightly-rostered player who could score big.</dd>
<dt>Bust</dt><dd>A popular player likely to disappoint this week.</dd></dl></div></details>
</div>`;

  sub("fantasy","fantasy");
  db.collection("tracked").onSnapshot(snap=>{ S.tracked=snap.docs.map(d=>({id:d.id,...d.data()})); renderTracker(); },err=>console.warn("tracked",err));
  db.collection("pstats").onSnapshot(snap=>{ S.pstats=snap.docs.map(d=>({id:d.id,...d.data()})); renderTracker(); },err=>console.warn("pstats",err));
  subMin("games","games");

  subMin("standings","standings");
  subMin("injuries","injuries");
  db.doc("league/standings").onSnapshot(snap=>{ LEAGUE={standings:(snap.exists&&snap.data().divisions)||LEAGUE.standings||{}}; syncView(); renderAll(); },err=>console.warn("league",err));
  db.collection("teams").onSnapshot(snap=>{
    snap.docs.forEach(d=>{
      const a=d.id.toUpperCase(), t=d.data(), u=t&&t.meta&&t.meta.updatedAt;

    if(first) maybeLoadTeam(CUR);
  },err=>console.warn("teams",err));
})();

/* ---------- player pool ---------- */
let POOLC={n:-1, ros:null, list:[], map:{}};
function pool(){
  const ros=fdoc("ros");
  if(POOLC.n===NFLIDX.length && POOLC.ros===ros) return POOLC;
  const list=[], map={};
  NFLIDX.forEach(p=>{ const pos=p.pos==="PK"?"K":p.pos; if(!["QB","RB","WR","TE","K"].includes(pos)) return; if(p.st && !["ACT","RES","PUP"].includes(p.st)) return;
    const o={id:p.id,name:p.name,pos,abbr:p.abbr,key:p.key,rank:9999}; list.push(o); map[o.id]=o; });
  Object.keys(TEAMS).forEach(a=>{ const o={id:"def-"+a.toLowerCase(),name:TEAMS[a][1]+" D/ST",pos:"DEF",abbr:a,key:norm2(TEAMS[a][1]+"dst"),rank:9999}; list.push(o); map[o.id]=o; });
  (ros?.players||[]).forEach((r,i)=>{
    let o=null;
    if(r.pos==="DEF") o=map["def-"+String(r.abbr||"").toLowerCase()];
    else { const k=norm2(r.name); o=list.find(p=>p.key===k && p.abbr===r.abbr) || list.find(p=>p.key===k && p.pos===r.pos); }
    if(o && o.rank===9999) o.rank=i+1;
  });
  const po={RB:0,WR:1,QB:2,TE:3,DEF:4,K:5};
  list.sort((a,b)=>a.rank-b.rank || po[a.pos]-po[b.pos] || a.name.localeCompare(b.name));
  POOLC={n:NFLIDX.length, ros, list, map}; return POOLC;
}
const P=id=>pool().map[id] || {id, name:id.replace(/^[a-z]+-/,"").replace(/-/g," "), pos:"?", abbr:""};

/* ---------- scoring ---------- */
function fpts(st, scoring, pos){
  if(!st) return 0;
  const n=k=>Number(st[k]||0);
  if(pos==="DEF"){
    const pa=st.pa==null?null:Number(st.pa);
    const tier=pa==null?0:pa===0?10:pa<=6?7:pa<=13?4:pa<=20?1:pa<=27?0:pa<=34?-1:-4;
    return n("sack")+2*n("def_int")+2*n("fr")+6*n("def_td")+2*n("safety")+6*n("ret_td")+tier;
  }
  if(pos==="K") return n("xp")-n("xpmiss")+3*n("fg0_39")+4*n("fg40_49")+5*n("fg50")-n("fgmiss");
  const R={PPR:1,Half:0.5,Standard:0}[scoring]??1;
  return n("pass_yd")*0.04+4*n("pass_td")-2*n("int")+n("rush_yd")*0.1+6*n("rush_td")+R*n("rec")+n("rec_yd")*0.1+6*n("rec_td")-2*n("fum")+2*n("two")+6*n("ret_td");
}
const fmtPts=x=>(Math.round(x*100)/100).toFixed(2);
function ptsFor(pid,w,L){ const fs=LG.fstats[wKey(w)]; const st=fs?.players?.[pid]; return st?fpts(st,L.scoring,P(pid).pos):0; }
function gameOf(abbr,w){ const g=LG.fweeks[wKey(w)]?.games||[]; return g.find(x=>x.home===abbr||x.away===abbr)||null; }
function locked(pid,w){ const p=P(pid); const g=gameOf(p.abbr,w); return !!(g && g.kickoff && Date.parse(g.kickoff)<=Date.now()); }
function gameLabel(pid,w){
  const p=P(pid), g=gameOf(p.abbr,w); if(!LG.fweeks[wKey(w)]) return p.abbr;
  if(!g) return `${p.abbr} · BYE`;
  const opp=g.home===p.abbr?"vs "+g.away:"@ "+g.home;
  const k=Date.parse(g.kickoff); if(k>Date.now()) return `${p.abbr} ${opp} · ${fmtDate(g.kickoff,{weekday:"short"})} ${fmtDate(g.kickoff,{hour:"numeric",minute:"2-digit"})}`;
  return `${p.abbr} ${opp}`;
}
function curWeek(){ return Number(fdoc("week")?.week)||1; }
function actWeek(L){ return Math.max(curWeek(), L?.startWeek||1); }

/* ---------- league helpers ---------- */
function lgStatus(l){ return l.status==="setup"?`Setting up · ${(l.members||[]).length}/${l.size} teams`:l.status==="drafting"?"Draft in progress":l.status==="done"?"Season complete":"In season"; }
function teamName(L,uid){ return L.teams?.[uid]?.name || "Team"; }
function lgRef(id){ return ACC.db.doc("leagues/"+id); }
async function withLease(id, fn){
  const ref=lgRef(id), holder=ACC.id+":"+Math.random().toString(36).slice(2,8);
  for(let i=0;i<8;i++){
    let r; try{ r=await ref.acquire({holder, ttlMs:1000}); }catch(e){ r={acquired:false}; }
    if(r.acquired){ const s=await ref.get(); const patch=await fn(s.exists?s.data():null); if(patch){ if(patch.__set) await ref.set(patch.__set); else await ref.update(patch); } return patch; }
    await sleep(350+Math.random()*600);
  }
  throw new Error("busy");
}
function newCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function onClockUid(L,n){ const o=L.draft.order, k=o.length, r=Math.floor(n/k), i=n%k; return r%2===0?o[i]:o[k-1-i]; }
function draftedIds(L){ return new Set((L.draft?.picks||[]).map(p=>p.pid)); }
function rosterOf(L,uid){ if(L.status==="drafting"||L.status==="setup") return (L.draft?.picks||[]).filter(p=>p.uid===uid).map(p=>p.pid); return (L.rosters?.[uid]||[]).slice(); }
function allRostered(L){ const s=new Set(); Object.values(L.rosters||{}).forEach(a=>a.forEach(x=>s.add(x))); return s; }
function autoLineup(ids){
  const left=ids.map(id=>P(id)).sort((a,b)=>a.rank-b.rank), lu={};
  SLOTS.forEach(([s,c])=>{ lu[s]=[]; for(let i=0;i<c;i++){ const j=left.findIndex(p=>SLOT_OK[s].includes(p.pos)); if(j>=0){ lu[s].push(left[j].id); left.splice(j,1);} else lu[s].push(null);} });
  return lu;
}
function lineupFor(L,uid,w){
  const mine=L.lineups?.[uid]||{}; let lu=null;
  for(let x=w;x>=1;x--){ if(mine[wKey(x)]){ lu=mine[wKey(x)]; break; } }
  const roster=L.rosters?.[uid]||[];
  if(!lu) return autoLineup(roster);
  lu=JSON.parse(JSON.stringify(lu));
  const past=w<curWeek() || (LG.fstats[wKey(w)]?.final);
  if(!past){ const rs=new Set(roster); SLOTS.forEach(([s,c])=>{ lu[s]=(lu[s]||[]).slice(0,c); while(lu[s].length<c) lu[s].push(null); lu[s]=lu[s].map(id=>id&&rs.has(id)?id:null); }); }
  return lu;
}
function starters(lu){ return SLOTS.flatMap(([s])=>(lu[s]||[]).filter(Boolean)); }
function teamScore(L,uid,w){ return starters(lineupFor(L,uid,w)).reduce((a,id)=>a+ptsFor(id,w,L),0); }
function roundRobin(ids, weeks){
  const t=ids.slice(); if(t.length%2) t.push(null);
  const n=t.length, out={};
  weeks.forEach((w,wi)=>{
    const r=wi%(n-1), arr=[t[0]].concat(t.slice(1).map((_,i)=>t[1+((i+r)%(n-1))]));
    const pairs=[]; for(let i=0;i<n/2;i++) pairs.push([arr[i],arr[n-1-i]]);
    out[wKey(w)]=pairs;
  });
  return out;
}
function standings(L){
  const rec={}; (L.members||[]).forEach(u=>rec[u]={uid:u,w:0,l:0,t:0,pf:0,pa:0});
  for(let w=L.startWeek||1; w<=REG_END; w++){
    if(!LG.fstats[wKey(w)]?.final) continue;
    (L.matchups?.[wKey(w)]||[]).forEach(([a,b])=>{
      if(!a||!b||!rec[a]||!rec[b]) return;
      const sa=teamScore(L,a,w), sb=teamScore(L,b,w);
      rec[a].pf+=sa; rec[a].pa+=sb; rec[b].pf+=sb; rec[b].pa+=sa;
      if(sa>sb){rec[a].w++;rec[b].l++;} else if(sb>sa){rec[b].w++;rec[a].l++;} else {rec[a].t++;rec[b].t++;}
    });
  }
  return Object.values(rec).sort((x,y)=>(y.w+y.t/2)-(x.w+x.t/2) || y.pf-x.pf);
}
function matchupsFor(L,w){
  if(w<=REG_END) return L.matchups?.[wKey(w)]||[];
  if(!LG.fstats[wKey(REG_END)]?.final) return [];
  const s=standings(L).map(r=>r.uid);
  const four=s.length>=4;
  if(w===REG_END+1) return four?[[s[0],s[3]],[s[1],s[2]]]:[[s[0],s[1]]];
  if(w===REG_END+2 && four){
    const semi=[[s[0],s[3]],[s[1],s[2]]]; if(!LG.fstats[wKey(REG_END+1)]?.final) return [];
    const win=semi.map(([a,b])=>teamScore(L,a,REG_END+1)>=teamScore(L,b,REG_END+1)?a:b);
    return [win];
  }
  return [];
}
function lastWeek(L){ const n=(L.members||[]).length; return REG_END+(n>=4?2:1); }
function myMatch(L,uid,w){ return matchupsFor(L,w).find(m=>m.includes(uid))||null; }

async function createLeague(f){

async function joinLeague(code, team){
  code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==6) return toast("League codes are 6 letters and numbers.");
  const s=await lgRef(code).get();

    });

  }catch(e){ toast(e.message==="full"?"That league is full.":e.message==="started"?"That league already drafted.":"Couldn't join right now. Try again."); }
}
async function startDraft(){
  const L=LG.doc; if(!L) return;
  try{ await withLease(L.id, D=>{
    if(D.status!=="setup") return null;
    if((D.members||[]).length<2) throw new Error("few");
    const order=D.members.slice(); for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]];}
    return {status:"drafting", size:order.length, draft:{...D.draft, order, picks:[], rounds:ROSTER_MAX, pickStart:nowIso(), startedAt:nowIso()}};
  }); }catch(e){ console.warn("startDraft",e); toast(e.message==="few"?"You need at least 2 teams to draft.":"Couldn't start the draft. Try again."); }
}
function autoChoice(L,uid){
  const taken=draftedIds(L), mine=rosterOf(L,uid).map(P), cnt={}; mine.forEach(p=>cnt[p.pos]=(cnt[p.pos]||0)+1);
  const left=L.draft.rounds-mine.length;
  const need=Object.entries(NEEDS).filter(([p,c])=>(cnt[p]||0)<c).map(([p])=>p);
  const needCount=Object.entries(NEEDS).reduce((a,[p,c])=>a+Math.max(0,c-(cnt[p]||0)),0);
  const avail=pool().list.filter(p=>!taken.has(p.id));
  let pick;
  const q=(L.queues?.[uid]||[]).map(id=>avail.find(p=>p.id===id)).filter(Boolean);
  if(left>needCount) pick=q.find(p=>(cnt[p.pos]||0)<CAPS[p.pos]); else pick=q.find(p=>need.includes(p.pos));
  if(left<=needCount) pick=avail.find(p=>need.includes(p.pos));
  if(!pick) pick=avail.find(p=>!["K","DEF"].includes(p.pos) && (cnt[p.pos]||0)<CAPS[p.pos]);
  return (pick||avail[0])?.id;
}
async function makePick(pid, auto){
  const L=LG.doc; if(!L||L.status!=="drafting"||LG.busy) return;
  const n=(L.draft.picks||[]).length;
  LG.busy=true;
  try{ await withLease(L.id, D=>{
    if(D.status!=="drafting") return null;
    const picks=D.draft.picks||[]; if(picks.length!==n) return null;
    const who=onClockUid(D,n);
    if(!auto && who!==ACC.id) return null;
    if(auto && Date.now()-Date.parse(D.draft.pickStart) < D.clock*1000) return null;
    const id=auto?autoChoice(D,who):pid;
    if(!id || picks.some(p=>p.pid===id)) return null;
    const np=[...picks,{uid:who,pid:id,auto:!!auto,t:nowIso()}];
    const total=D.draft.rounds*D.draft.order.length;
    if(np.length<total) return {draft:{...D.draft, picks:np, pickStart:nowIso()}};
    return finishDraft(D,np);
  }); }catch(e){ if(!auto) toast("Pick didn't go through. Try again."); }
  LG.busy=false;
}
function finishDraft(D,picks){
  const rosters={}, lineups={}; D.members.forEach(u=>rosters[u]=picks.filter(p=>p.uid===u).map(p=>p.pid));
  const cw=curWeek(), gw=LG.fweeks[wKey(cw)]?.games||[];
  const first=gw.length?Math.min(...gw.map(g=>Date.parse(g.kickoff)||Infinity)):0;
  let start=(first && Date.now()<first)?cw:cw+1; if(start>REG_END) start=REG_END;
  D.members.forEach(u=>lineups[u]={[wKey(start)]:autoLineup(rosters[u])});
  const weeks=[]; for(let w=start; w<=REG_END; w++) weeks.push(w);
  return {status:"season", startWeek:start, draft:{...D.draft, picks, pickStart:"", doneAt:nowIso()}, rosters, lineups, matchups:roundRobin(D.draft.order, weeks)};
}
function checkDraftClock(){
  const L=LG.doc;
  clearInterval(LG.tick); LG.tick=null;
  if(!L) return;
  if(L.status==="setup" && L.draft?.startAt){
    LG.tick=setInterval(()=>{ const t=Date.parse(L.draft.startAt)-Date.now(); const el=$("lgCount"); if(el) el.textContent=t>0?dur(t):"Starting…"; if(t<=0){ clearInterval(LG.tick); if(L.members.length>=2) startDraft(); } },1000);
  }
  if(L.status==="drafting"){
    LG.tick=setInterval(()=>{
      const D=LG.doc; if(!D||D.status!=="drafting") return;
      const left=D.clock*1000-(Date.now()-Date.parse(D.draft.pickStart));
      const el=$("lgClock"); if(el){ el.textContent=left>0?dur(left):"0:00"; el.classList.toggle("urgent",left<15000); }
      if(left< -1500-Math.random()*2500) makePick(null,true);
    },1000);
  }
}
function dur(ms){ const s=Math.max(0,Math.ceil(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; if(h>24) return Math.floor(h/24)+"d "+(h%24)+"h"; return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`; }
async function setLineup(w, lu){
  const L=LG.doc; await lgRef(L.id).update({lineups:{[ACC.id]:{[wKey(w)]:lu}}});
}
async function addDrop(addId, dropId){
  const L=LG.doc, w=actWeek(L);
  if(addId && locked(addId,w)) return toast("That player's game has started. Add him after this week.");
  if(dropId && locked(dropId,w)) return toast("You can't drop a player whose game has started.");
  try{ await withLease(L.id, D=>{
    const ros=(D.rosters?.[ACC.id]||[]).slice();
    if(addId){ const all=new Set(); Object.values(D.rosters||{}).forEach(a=>a.forEach(x=>all.add(x))); if(all.has(addId)) throw new Error("taken"); }
    if(dropId){ const i=ros.indexOf(dropId); if(i<0) return null; ros.splice(i,1); }
    if(addId){ if(ros.length>=ROSTER_MAX) throw new Error("full"); ros.push(addId); }
    const tx=[{t:nowIso(),uid:ACC.id,add:addId||"",drop:dropId||""},...(D.txns||[])].slice(0,40);
    return {rosters:{[ACC.id]:ros}, txns:tx};
  }); toast(addId?`Added ${P(addId).name}.`:`Dropped ${P(dropId).name}.`); closeSheet(); }
  catch(e){ toast(e.message==="taken"?"Someone already grabbed him.":e.message==="full"?"Your roster is full. Pick someone to drop.":"Couldn't save that move. Try again."); }
}

  <div class="card lg-form"><div class="lg-ft">Join a league</div>
    <form data-lform="join" class="lg-grid"><label>League code<input name="code" maxlength="6" autocomplete="off" placeholder="e.g. K7Q2MX" required></label>
    <label>Your team name<input name="team" maxlength="28" placeholder="e.g. Purple Reign" required></label><button class="btn-gold" type="submit">Join league</button></form></div>
  <div class="card lg-form"><div class="lg-ft">Create a league</div>
    <form data-lform="create" class="lg-grid">
      <label>League name<input name="name" maxlength="40" placeholder="e.g. Sunday Funday" required></label>
      <label>Your team name<input name="team" maxlength="28" placeholder="e.g. Skol Patrol" required></label>
      <div class="lg-row"><label>Teams<select name="size">${[4,6,8,10,12].map(n=>`<option${n===10?" selected":""}>${n}</option>`).join("")}</select></label>
      <label>Scoring<select name="scoring"><option value="PPR">PPR</option><option value="Half">Half-PPR</option><option value="Standard">Standard</option></select></label></div>
      <div class="lg-row"><label>Pick clock<select name="clock"><option value="60">60 sec</option><option value="90" selected>90 sec</option><option value="120">2 min</option></select></label>
      <label>Draft time (optional)<input name="when" type="datetime-local"></label></div>
      <button class="btn-gold" type="submit">Create league</button></form>
    <div class="foot">Lineup: QB, 2 RB, 2 WR, TE, FLEX, K, DEF + ${BENCH} bench. Regular season runs through Week ${REG_END}, then playoffs.</div></div>`;
}
function renderSetup(L,isC){
  const mem=(L.members||[]).map(u=>`<div class="row">${av(u)}<div class="grow"><div class="t1">${esc(teamName(L,u))}${u===L.commish?' <span class="chip pos">COMMISH</span>':""}${u===ACC.id?' <span class="chip new">YOU</span>':""}</div></div>${u===ACC.id?`<button class="tbtn" data-lrename="1">Rename</button>`:""}</div>`).join("");
  const when=L.draft?.startAt;
  return `<div class="card lg-invite"><div class="lg-ft">Invite friends</div>
      <ol class="lsteps"><li>Friends create a free North Huddle account (person icon, top right).</li>
      <li>Send them this league code: <b class="lg-code">${esc(L.id)}</b></li><li>They open Fantasy → League, sign in, and tap <b>Join</b>.</li></ol></div>
    <h2>Teams (${(L.members||[]).length}/${L.size})</h2><div class="list">${mem}</div>
    <div class="card"><div class="lg-ft">Draft</div>
      ${when?`<p>Scheduled for <b>${esc(fmtDate(when,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))} CT</b> · starts in <b id="lgCount">${dur(Date.parse(when)-Date.now())}</b></p>`:`<p>No draft time set yet.</p>`}
      <p class="t2">Live snake draft · ${L.clock}s per pick · Missed picks are made automatically.</p>
      ${isC?`<form data-lform="when" class="lg-row"><label>Draft time<input name="when" type="datetime-local"></label><button class="tbtn" type="submit">Save</button></form>
        <button class="btn-gold" data-lstart="1">Start draft now</button>
        <details class="lg-danger"><summary>Commissioner tools</summary><button class="danger" data-ldelete="1">Delete league</button></details>`:`<p class="t2">Your commissioner starts the draft.</p>`}
    </div>`;
}
function playerRow(p, right){ return `<div class="row frow lg-pr"><span class="tb-sm">${badge(p.abbr||"")}</span><div class="grow"><div class="t1">${esc(p.name)} <span class="chip pos">${esc(p.pos)}</span></div>${p.rank<9999?`<div class="t2">Rank ${p.rank}</div>`:""}</div>${right||""}</div>`; }
function posFilter(){ return posChips(["ALL","QB","RB","WR","TE","K","DEF"],LG.pos,"lpos"); }
function renderDraft(L){
  const picks=L.draft.picks||[], n=picks.length, total=L.draft.rounds*L.draft.order.length;
  const who=onClockUid(L,n), mine=who===ACC.id, k=L.draft.order.length;
  const left=L.clock*1000-(Date.now()-Date.parse(L.draft.pickStart));
  const recent=picks.slice(-6).reverse().map((p,i)=>{const pl=P(p.pid); return `<div class="row"><span class="rk num">${n-i}</span><div class="grow"><div class="t1">${esc(pl.name)} <span class="chip pos">${esc(pl.pos)}</span></div><div class="t2">${esc(teamName(L,p.uid))}${p.auto?" · auto":""}</div></div></div>`;}).join("");
  const myR=rosterOf(L,ACC.id).map(P);
  return `<div class="lg-clock${mine?" mine":""}"><div><div class="label">Round ${Math.floor(n/k)+1} · Pick ${n+1} of ${total}</div>
      <div class="lg-otc">${mine?"You're on the clock!":esc(teamName(L,who))+" is picking"}</div></div><div class="lg-time num" id="lgClock">${dur(left)}</div></div>
    <h2>Available players</h2>
    <input type="search" id="lgSearch" placeholder="Search players" value="${esc(LG.q)}" aria-label="Search players">
    ${posFilter()}
    <div class="list lg-avail" id="lgList">${availRows(L, mine)}</div>
    ${recent?`<h2>Recent picks</h2><div class="list">${recent}</div>`:""}
    <h2>Your team (${myR.length}/${L.draft.rounds})</h2>
    <div class="list">${myR.length?myR.map(p=>playerRow(p)).join(""):`<div class="empty">No picks yet.</div>`}</div>
    <div class="foot">Players are ranked for rest-of-season PPR. If time runs out, the best available player that fits your roster is picked for you.</div>`;
}
function availRows(L, canPick){
  const taken=L.status==="drafting"?draftedIds(L):allRostered(L);
  const q=norm2(LG.q);
  const list=pool().list.filter(p=>!taken.has(p.id) && (LG.pos==="ALL"||p.pos===LG.pos) && (!q||p.key.includes(q))).slice(0,60);
  if(!list.length) return `<div class="empty">${NFLIDX.length?"No players match.":"Loading players…"}</div>`;
  const qd=new Set(L.queues?.[ACC.id]||[]);
  return list.map(p=>playerRow(p, L.status==="drafting"
    ? `${starBtn(p.id,qd)}<button class="tbtn" data-ldraft="${esc(p.id)}"${canPick?"":" disabled"}>Draft</button>`
    : (locked(p.id,actWeek(L))?`<span class="t2">Locked</span>`:`<button class="tbtn" data-ladd="${esc(p.id)}">Add</button>`))).join("");
}
function weekNav(L){
  const lw=lastWeek(L); if(LG.wk==null) LG.wk=Math.min(Math.max(curWeek(),L.startWeek||1),lw);
  return `<div class="lg-wk"><button class="x" data-lwk="-1" aria-label="Previous week"${LG.wk<= (L.startWeek||1)?" disabled":""}>‹</button>
    <div class="grow"><div class="lg-ft">Week ${LG.wk}${LG.wk>REG_END?" · Playoffs":""}</div><div class="t2">${LG.fstats[wKey(LG.wk)]?.final?"Final":LG.fstats[wKey(LG.wk)]?`Live · updated ${esc(ago(LG.fstats[wKey(LG.wk)].updatedAt))}`:LG.wk<curWeek()?"Waiting for scores":"Upcoming"}</div></div>
    <button class="x" data-lwk="1" aria-label="Next week"${LG.wk>=lw?" disabled":""}>›</button></div>`;
}
function renderMatchup(L){
  let h=weekNav(L);
  const m=myMatch(L,ACC.id,LG.wk);
  if(!m){ const others=matchupsFor(L,LG.wk); return h+`<div class="card empty">${LG.wk>REG_END?(others.length?"You're not in this playoff round.":"Playoff matchups appear after Week "+REG_END+" is final."):"No matchup this week (bye)."}</div>`+leagueBoard(L,LG.wk); }
  const opp=m[0]===ACC.id?m[1]:m[0];
  const a=lineupFor(L,ACC.id,LG.wk), b=opp?lineupFor(L,opp,LG.wk):null;
  const sa=teamScore(L,ACC.id,LG.wk), sb=opp?teamScore(L,opp,LG.wk):0;
  h+=`<div class="lg-score"><div><div class="t2">${av(ACC.id,"sm")} ${esc(teamName(L,ACC.id))}</div><div class="lg-big num${sa>=sb?" lead":""}">${fmtPts(sa)}</div></div><div class="t2">vs</div>
     <div style="text-align:right"><div class="t2">${opp?esc(teamName(L,opp))+" "+av(opp,"sm"):"Bye"}</div><div class="lg-big num${sb>sa?" lead":""}">${opp?fmtPts(sb):"–"}</div></div></div>`;
  const nm=(id,r)=>`<div class="mu-p${r?" r":""}">${id?`<div class="t1">${esc(P(id).name)}</div><div class="t2">${esc(gameLabel(id,LG.wk))}</div>`:`<div class="t2">Empty</div>`}</div>`;
  const pt=id=>`<div class="mu-pts num">${id?ptsFor(id,LG.wk,L).toFixed(1):"–"}</div>`;
  const rows=SLOTS.flatMap(([s,c])=>Array.from({length:c},(_,i)=>{
    const x=a[s]?.[i], y=b?.[s]?.[i];
    return `<div class="mu-row">${nm(x)}${pt(x)}<div class="mu-slot">${s}</div>${b?pt(y)+nm(y,true):"<div></div><div></div>"}</div>`;
  })).join("");
  h+=`<div class="list mu">${rows}</div>`;
  return h+leagueBoard(L,LG.wk);
}
function leagueBoard(L,w){
  const ms=matchupsFor(L,w); if(!ms.length) return "";
  return `<h2>All matchups</h2><div class="list">${ms.map(([x,y])=>`<div class="row"><div class="grow t1">${esc(teamName(L,x))}</div><b class="num">${fmtPts(teamScore(L,x,w))}</b><span class="t2">–</span><b class="num">${y?fmtPts(teamScore(L,y,w)):"–"}</b><div class="grow t1" style="text-align:right">${y?esc(teamName(L,y)):"Bye"}</div></div>`).join("")}</div>`;
}
function renderTeam(L){
  const w=actWeek(L);
  const lu=lineupFor(L,ACC.id,w), st=new Set(starters(lu));
  const bench=(L.rosters?.[ACC.id]||[]).filter(id=>!st.has(id));
  const row=(slot,i,id)=>{ const lk=id&&locked(id,w), sel=LG.swap&&LG.swap.slot===slot&&LG.swap.i===i;
    return `<button class="row lu-row${sel?" sel":""}" data-lslot="${slot}" data-li="${i}"${lk?' data-locked="1"':""}><span class="lu-slot">${slot==="BN"?"BN":slot}</span>
      ${id?`<span class="tb-sm">${badge(P(id).abbr)}</span><div class="grow"><div class="t1">${esc(P(id).name)} <span class="chip pos">${esc(P(id).pos)}</span></div><div class="t2">${esc(gameLabel(id,w))}${lk?" · locked":""}</div></div>`:`<div class="grow t2">Empty — tap to fill</div>`}</button>`; };
  let h=`<div class="lg-wk"><div class="grow"><div class="lg-ft">Week ${w} lineup</div><div class="t2">Tap a player, then tap where to move him. Players lock when their game starts.</div></div></div>`;
  h+=`<div class="list">${SLOTS.flatMap(([s,c])=>Array.from({length:c},(_,i)=>row(s,i,lu[s]?.[i]))).join("")}</div>`;
  h+=`<h2>Bench (${bench.length}/${BENCH})</h2><div class="list">${bench.length?bench.map((id,i)=>row("BN",i,id)).join(""):`<div class="empty">Bench is empty.</div>`}</div>`;
  h+=`<div class="foot">Roster ${(L.rosters?.[ACC.id]||[]).length}/${ROSTER_MAX}. Add players from the Players tab.</div>`;
  LG._bench=bench; LG._lu=lu; LG._w=w;
  return h;
}
async function tapSlot(slot,i){
  const L=LG.doc, w=LG._w, lu=JSON.parse(JSON.stringify(LG._lu)), bench=LG._bench;
  const idAt=(s,j)=>s==="BN"?bench[j]:lu[s]?.[j];
  const cur=idAt(slot,i);
  if(!LG.swap){
    if(cur && locked(cur,w)) return toast("He's locked — his game has started.");
    if(!cur && slot==="BN") return;
    LG.swap={slot,i}; renderFantasy(); return;
  }
  const A=LG.swap; LG.swap=null;
  if(A.slot===slot && A.i===i){ renderFantasy(); return; }
  const a=idAt(A.slot,A.i), b=cur;
  if(b && locked(b,w)){ renderFantasy(); return toast("That spot's player is locked."); }
  const fits=(id,s)=>!id || s==="BN" || SLOT_OK[s].includes(P(id).pos);
  if(!fits(a,slot) || !fits(b,A.slot)){ renderFantasy(); return toast("That player can't play there."); }
  if(A.slot!=="BN") lu[A.slot][A.i]=b||null;
  if(slot!=="BN") lu[slot][i]=a||null;
  await setLineup(w,lu).catch(()=>toast("Couldn't save your lineup. Try again."));
}
function renderFA(L){
  return waiverInfo(L)+`<input type="search" id="lgSearch" placeholder="Search free agents" value="${esc(LG.q)}" aria-label="Search free agents">${posFilter()}
    <div class="list lg-avail" id="lgList">${availRows(L,true)}</div>
    ${(L.txns||[]).length?`<h2>Recent moves</h2><div class="list">${L.txns.slice(0,8).map(t=>`<div class="row"><div class="grow"><div class="t1">${esc(teamName(L,t.uid))}</div><div class="t2">${t.trade?"Trade: "+esc(t.trade):`${t.add?"Added "+esc(P(t.add).name):""}${t.bid!=null?` ($${t.bid})`:""}${t.add&&t.drop?" · ":""}${t.drop?"Dropped "+esc(P(t.drop).name):""}`}</div></div><span class="t2">${esc(ago(t.t))}</span></div>`).join("")}</div>`:""}
    <div class="foot">Outside the waiver window, free agents are first come, first served. Players can't be added or dropped once their game starts.</div>`;
}
function openAddSheet(addId){
  const L=LG.doc, ros=L.rosters?.[ACC.id]||[];
  if(inWaiverWindow()) return openClaimSheet(addId);
  if(ros.length<ROSTER_MAX) return addDrop(addId,null);
  const p=P(addId);
  $("sheet").innerHTML=`<div class="sheet-head"><div><div class="label">Roster full</div><div class="nm" style="font-size:24px">Drop someone for ${esc(p.name)}</div></div><button class="x" id="closeSheet" aria-label="Close">×</button></div>
    <div class="list">${ros.map(id=>{const q=P(id), lk=locked(id,actWeek(L)); return `<button class="row" data-ldrop="${esc(id)}" data-ladd2="${esc(addId)}"${lk?" disabled":""}><span class="tb-sm">${badge(q.abbr)}</span><div class="grow"><div class="t1">${esc(q.name)} <span class="chip pos">${esc(q.pos)}</span></div>${lk?'<div class="t2">Locked</div>':""}</div><span class="t2">Drop</span></button>`;}).join("")}</div>`;
  $("sheetBg").hidden=false;
}
function renderStandings(L){
  const s=standings(L);
  return `<div class="tbl-wrap"><table><thead><tr><th>Team</th><th>W-L-T</th><th>PF</th><th>PA</th></tr></thead><tbody>
    ${s.map((r,i)=>`<tr${r.uid===ACC.id?' class="us"':""}><td><span class="td-team">${i+1}. ${av(r.uid,"sm")} ${esc(teamName(L,r.uid))}</span></td><td>${r.w}-${r.l}-${r.t}</td><td>${fmtPts(r.pf)}</td><td>${fmtPts(r.pa)}</td></tr>`).join("")}</tbody></table></div>
    <div class="foot">Top ${s.length>=4?4:2} make the playoffs after Week ${REG_END}. Ties broken by points scored.</div>`;
}
function renderDraftResults(L){
  const picks=L.draft?.picks||[], k=L.draft?.order?.length||1;
  return `<div class="list">${picks.map((p,i)=>`<div class="row"><span class="rk num">${i+1}</span><div class="grow"><div class="t1">${esc(P(p.pid).name)} <span class="chip pos">${esc(P(p.pid).pos)}</span></div><div class="t2">Rd ${Math.floor(i/k)+1} · ${esc(teamName(L,p.uid))}${p.auto?" · auto":""}</div></div></div>`).join("")}</div>`;
}

/* ---------- events ---------- */
$("acctBtn").addEventListener("click",openAcct);
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-lopen]"); if(o){ LG.cur=o.dataset.lopen; LG.wk=null; LG.view="matchup"; subLeague(); saveSettings(); closeSheet(); goLeague(); return; }
  if(e.target.closest("[data-lgo]")){ closeSheet(); goLeague(); return; }
  if(e.target.closest("[data-acct]")){ openAcct(); return; }
  const dr=e.target.closest("[data-ldrop]"); if(dr){ addDrop(dr.dataset.ladd2, dr.dataset.ldrop); return; }
});
function goLeague(){ FX.sec="league"; store.set("vh_fsec","league"); setTab("fantasy"); renderFantasy(); }
$("fantasyBody").addEventListener("click",async e=>{
  const t=e.target;
  const v=t.closest("[data-lview]"); if(v){ LG.view=v.dataset.lview; LG.q=""; LG.pos="ALL"; LG.swap=null; renderFantasy(); return; }
  const lp=t.closest("[data-lpos]"); if(lp){ LG.pos=lp.dataset.lpos; renderFantasy(); return; }
  const wk=t.closest("[data-lwk]"); if(wk){ LG.wk+=Number(wk.dataset.lwk); renderFantasy(); return; }
  if(t.closest("[data-lswitch]")){ LG.cur=null; LG.doc=null; if(LG.unsub){LG.unsub();LG.unsub=null;} clearInterval(LG.tick); saveSettings(); renderFantasy(); return; }
  if(t.closest("[data-lstart]")){ startDraft(); return; }
  const d=t.closest("[data-ldraft]"); if(d){ d.disabled=true; makePick(d.dataset.ldraft,false); return; }
  const a=t.closest("[data-ladd]"); if(a){ openAddSheet(a.dataset.ladd); return; }
  const sl=t.closest("[data-lslot]"); if(sl){ tapSlot(sl.dataset.lslot, Number(sl.dataset.li)); return; }
  if(t.closest("[data-lrename]")){ openRename(LG.doc); return; }
  const del=t.closest("[data-ldelete]"); if(del){ if(!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent="Tap again to delete for everyone"; return; } await lgRef(LG.doc.id).delete(); LG.cur=null; LG.doc=null; saveSettings(); renderFantasy(); toast("League deleted."); return; }
});
function openRename(L){
  $("sheet").innerHTML=`<div class="sheet-head"><div class="nm" style="font-size:24px">Rename your team</div><button class="x" id="closeSheet" aria-label="Close">×</button></div>
    <form data-lform="rename" class="lg-grid"><label>Team name<input name="team" maxlength="28" value="${esc(teamName(L,ACC.id))}" required></label><button class="btn-gold" type="submit">Save</button></form>`;
  $("sheetBg").hidden=false;
}
document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-lform]"); if(!f) return; e.preventDefault();
  const v=Object.fromEntries(new FormData(f).entries()), kind=f.dataset.lform, btn=f.querySelector("button[type=submit]");
  if(btn) btn.disabled=true;
  try{
    if(kind==="create") await createLeague(v);
    else if(kind==="join") await joinLeague(v.code, v.team);
    else if(kind==="when"){ if(v.when) await lgRef(LG.doc.id).update({draft:{startAt:new Date(v.when).toISOString()}}); toast("Draft time saved."); }
    else if(kind==="rename"){ await lgRef(LG.doc.id).update({teams:{[ACC.id]:{name:v.team.slice(0,28)}}}); closeSheet(); }
  }catch(err){ console.warn(err); toast("Something went wrong. Try again."); }
  if(btn) btn.disabled=false;
});
$("fantasyBody").addEventListener("input",e=>{
  if(e.target.id!=="lgSearch") return;
  LG.q=e.target.value; const L=LG.doc; if(!L) return;
  const el=$("lgList"); if(el) el.innerHTML=availRows(L, L.status==="drafting"?onClockUid(L,(L.draft.picks||[]).length)===ACC.id:true);
});
$("fantasyBody").addEventListener("focusin",e=>{ if(e.target.matches("input,select")) LG.typing=true; });
$("fantasyBody").addEventListener("focusout",e=>{ if(e.target.matches("input,select")) setTimeout(()=>{ LG.typing=false; },200); });

/* ---------- boot ---------- */
(async()=>{
  const [user, db] = await Promise.all([claude.use("user"), claude.use("db")]);
  ACC.user=user; ACC.db=db;
  if(user && db){ ACC.me=await user.me(); ACC.id=ACC.me.id||null; }
  ACC.ready=true; renderAcct();
  if(ACC.id && db){ subLeagues(); subLeagueData(); loadSettings(); }
  renderFantasy();
})();

<script>
/* ===================== Extras: theme, waivers, trades, picks, chat, alerts, queue, mock, trophies, game day, stats ===================== */

/* ---------- theme ---------- */
let THEME=(()=>{ const v=store.get("vh_theme"); return ["auto","light","dark"].includes(v)?v:"auto"; })();
function applyTheme(){ const r=document.documentElement; if(THEME==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",THEME); }
function setTheme(v,fromSettings){ THEME=v; store.set("vh_theme",v); applyTheme(); document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===v))); if(!fromSettings) saveSettings(); }
function themeRow(){ return `<div class="fsetup"><div class="fs-row"><span class="fs-lbl">Theme</span><div class="fs-opts" role="group">${[["auto","Match phone"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button data-theme-set="${k}" aria-pressed="${THEME===k}">${l}</button>`).join("")}</div></div></div>`; }
applyTheme();
document.addEventListener("click",e=>{ const b=e.target.closest("[data-theme-set]"); if(b) setTheme(b.dataset.themeSet); });

/* ---------- time helpers (Central) ---------- */
function ctParts(t=Date.now()){
  const f=new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short",hour:"numeric",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(t));
  const g=k=>(f.find(x=>x.type===k)||{}).value;
  return {dow:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")), hour:Number(g("hour"))%24, ymd:`${g("year")}-${g("month")}-${g("day")}`};
}
function inWaiverWindow(){ const c=ctParts(); return c.dow===2 || (c.dow===3 && c.hour<4); }
function waiverKey(){ const c=ctParts(); return c.dow===3 ? c.ymd : ctParts(Date.now()+86400e3).ymd; }
function claimDue(key){ const c=ctParts(); return c.ymd>key || (c.ymd===key && c.hour>=4); }
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const budget=(L,uid)=>Number(L.faab?.[uid] ?? 100);

/* ---------- waivers (FAAB) ---------- */
function myClaims(L){ return Object.entries(L.claims||{}).filter(([,c])=>c.uid===ACC.id && c.status==="pending").map(([id,c])=>({id,...c})); }
function waiverInfo(L){
  const mine=myClaims(L);
  const head=inWaiverWindow()
    ? `<div class="card lg-wv"><div class="lg-ft">Waivers are open</div><p>Bid on free agents until <b>Wednesday 4 AM CT</b>. Highest bid wins; ties go to the team lower in the standings. Budget left: <b>$${budget(L,ACC.id)}</b>.</p></div>`
    : `<div class="card lg-wv"><p><b>Free agents:</b> first come, first served right now. Waivers open Tuesday and process Wednesday at 4 AM CT. Your budget: <b>$${budget(L,ACC.id)}</b>.</p></div>`;

  return head+list;
}
function openClaimSheet(addId){
